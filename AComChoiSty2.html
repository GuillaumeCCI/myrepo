<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Tableau de Bord Contextuel</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { DEFAULT: '#000099', light: '#e6e6ff', hover: '#0000cc' },
                        accent: { DEFAULT: '#810464', hover: '#64034e', light: '#fdf2f8' },
                        success: { DEFAULT: '#10b981', bg: '#ecfdf5', text: '#065f46', border: '#6ee7b7' },
                        error: { DEFAULT: '#ef4444', bg: '#fef2f2', text: '#991b1b', border: '#fca5a5' }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out forwards',
                        'slide-up': 'slideUp 0.4s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(15px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer components {
            .btn-choix {
                @apply flex items-center gap-3 p-4 border-2 border-slate-200 rounded-xl bg-slate-50 cursor-pointer transition-all duration-200 text-left w-full text-slate-700 text-[14px] md:text-base font-medium;
            }
            .btn-choix:hover:not(:disabled) {
                @apply border-brand bg-brand-light/30 transform -translate-y-0.5 shadow-md;
            }
            .btn-choix:disabled { @apply cursor-default transform-none shadow-none; }
            .btn-choix.juste { @apply border-success bg-success-bg text-success-text shadow-none ring-2 ring-success/20 font-bold; }
            .btn-choix.faux  { @apply border-error bg-error-bg text-error-text opacity-70; }
            .btn-choix.neutre-apres { @apply opacity-35 grayscale bg-slate-100 border-slate-200; }

            .lettre-bulle {
                @apply w-8 h-8 min-w-[2rem] rounded-full bg-white shadow-sm border border-slate-200 flex items-center justify-center font-bold text-slate-500 text-xs flex-shrink-0 transition-colors;
            }
            .btn-choix.juste .lettre-bulle { @apply bg-success text-white border-success; }
            .btn-choix.faux  .lettre-bulle { @apply bg-error text-white border-error; }
            .btn-choix:hover:not(:disabled) .lettre-bulle { @apply text-brand border-brand/30; }

            .step-dot { @apply w-2.5 h-2.5 rounded-full bg-slate-200 transition-all duration-300; }
            .step-dot.actif { @apply bg-accent ring-4 ring-accent-light scale-110; }
            .step-dot.done { @apply bg-brand; }
        }

        html { height: 100%; overflow: hidden; }
        body {
            height: 100%; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
        }
        body.pseudo-fullscreen {
            position: fixed !important; top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important;
            z-index: 999999 !important; margin: 0 !important;
        }
    </style>
</head>
<body class="text-slate-800 font-sans p-4 md:p-8 flex flex-col items-center pb-24">

    <button id="btn-fullscreen" class="fixed top-4 right-4 z-50 bg-white p-3 rounded-full shadow-lg border border-slate-200 text-brand hover:bg-brand hover:text-white transition-all" title="Plein écran">
        <svg id="icon-fs-enter" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        <svg id="icon-fs-exit" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>
    </button>

    <main class="w-full max-w-5xl flex flex-col gap-6 animate-fade-in mt-14 md:mt-0">
        
        <header class="bg-brand text-white rounded-3xl p-6 md:p-8 shadow-xl shadow-brand/10 flex flex-col md:flex-row items-start md:items-center gap-5 relative overflow-hidden">
            <div class="absolute -top-12 -right-12 w-40 h-40 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
            <div class="w-14 h-14 min-w-[56px] bg-white text-brand rounded-2xl flex items-center justify-center shadow-sm z-10">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
            </div>
            <div class="z-10 flex-1">
                <div class="text-brand-light text-xs font-bold tracking-widest uppercase mb-1">Analyse multi-facteurs</div>
                <h1 class="text-2xl md:text-3xl font-extrabold leading-tight mb-2">Le Tableau de Bord Contextuel</h1>
                <div class="text-white/80 text-sm font-medium">Sachez arbitrer quand les indicateurs se contredisent.</div>
            </div>
        </header>

        <div class="w-full flex flex-col gap-3 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm" id="progression-container">
            <div class="flex justify-between items-end text-sm">
                <span class="font-bold text-brand uppercase tracking-wider text-xs" id="prog-label">Scénario 1 sur 3</span>
                <span class="font-bold text-slate-500 bg-slate-100 px-3 py-1 rounded-full text-xs" id="prog-etape">Arbitrage managérial</span>
            </div>
            <div class="h-2 bg-slate-100 rounded-full overflow-hidden shadow-inner">
                <div class="h-full bg-brand rounded-full transition-all duration-500" id="prog-bar" style="width:0%"></div>
            </div>
            <div class="flex gap-2 justify-center mt-1" id="prog-dots"></div>
        </div>

        <div id="zone-dynamique" class="w-full min-h-[500px]"></div>
    </main>

<script>
// SCÉNARIOS (Textes pédagogiques explicites sur le conflit des variables)
const SCENARIOS = [
    {
        titre: "Incident serveur majeur",
        contexte: "Un défaut technique vient de couper l'accès à tous vos clients. Vous réunissez l'équipe technique.",
        consigne: "Face à ces indicateurs contradictoires, quel style adoptez-vous ?",
        gauges: [
            { label: "Culture d'entreprise", valText: "Plate (Start-up)", desc: "L'entreprise valorise fortement l'horizontalité et la consultation.", pct: 15 },
            { label: "Phase actuelle", valText: "Crise majeure", desc: "Panne critique en cours, impact financier direct à chaque minute.", pct: 95 },
            { label: "Maturité équipe", valText: "En développement", desc: "L'équipe maîtrise les bases mais manque d'autonomie sous pression.", pct: 40 }
        ],
        // Longueurs strictement égales : 88 caractères
        options: [
            { texte: "S1 Directif - Prendre les commandes, imposer un cap clair et agir vite dans l'urgence.", bonne: true },
            { texte: "S3 Participatif - Réunir toute l'équipe, débattre des solutions et voter la meilleure.", bonne: false },
            { texte: "S4 Délégatif - Laisser les différents experts gérer cette crise en complète autonomie.", bonne: false }
        ],
        fbJuste: "<div class='mb-2 text-slate-700'><strong class='text-success'>Culture vs Phase :</strong> La culture plate invite au Participatif, mais la crise impose d'agir vite. <em>L'urgence annule la culture.</em></div><div class='text-slate-700'><strong class='text-success'>Phase vs Équipe :</strong> L'équipe manque d'autonomie sous pression, déléguer est risqué. Face à l'urgence, le <strong>style Directif (S1)</strong> s'impose.</div>",
        fbFaux: "<div class='mb-2 text-slate-700'><strong class='text-error'>Erreur d'arbitrage :</strong> Vous avez privilégié la culture plate ou l'autonomie. Mais attention, en cas de crise majeure, <em>l'urgence prime sur la culture d'entreprise</em> !</div><div class='text-slate-700'>De plus, l'équipe n'est pas assez mature sous pression. Il fallait être <strong>Directif (S1)</strong>.</div>"
    },
    {
        titre: "Opérations courantes",
        contexte: "Vous prenez la direction d'un département pour organiser le nouveau cycle d'objectifs annuels.",
        consigne: "Comment arbitrez-vous cette situation ?",
        gauges: [
            { label: "Culture d'entreprise", valText: "Hiérarchie forte", desc: "Environnement ultra-procédurier, processus de validation verticaux.", pct: 90 },
            { label: "Phase actuelle", valText: "Période stable", desc: "Aucune pression urgente, phase de routine (Business As Usual).", pct: 10 },
            { label: "Maturité équipe", valText: "Experte (D4)", desc: "Équipe de seniors très qualifiés, totalement autonomes sur ces tâches.", pct: 95 }
        ],
        // Longueurs strictement égales : 88 caractères
        options: [
            { texte: "S4 Délégatif - Fixer le cadre global puis laisser cette équipe organiser son travail.", bonne: true },
            { texte: "S1 Directif - Imposer les processus étape par étape afin de respecter la hiérarchie.", bonne: false },
            { texte: "S2 Persuasif - Expliquer chaque décision pour tenter de convaincre les collaborateurs.", bonne: false }
        ],
        fbJuste: "<div class='mb-2 text-slate-700'><strong class='text-success'>Culture vs Équipe :</strong> La culture hiérarchique appelle au Directif, mais l'équipe est Experte (D4). <em>La maturité annule la hiérarchie.</em></div><div class='text-slate-700'><strong class='text-success'>Phase vs Équipe :</strong> La période est stable, rien ne presse. Imposer des règles à des experts va les démotiver. Le <strong>style Délégatif (S4)</strong> est le seul choix performant.</div>",
        fbFaux: "<div class='mb-2 text-slate-700'><strong class='text-error'>Erreur d'arbitrage :</strong> Vous avez suivi la culture hiérarchique. Mais regardez la jauge de Maturité : l'équipe est Experte (95%) ! <em>La maturité annule la hiérarchie.</em></div><div class='text-slate-700'>Lui imposer un cadre strict en période stable va la braquer. Il fallait lui faire confiance et choisir le <strong>style Délégatif (S4)</strong>.</div>"
    },
    {
        titre: "Lancement de projet",
        contexte: "Vous lancez un tout nouveau projet stratégique avec une équipe fraîchement constituée en interne.",
        consigne: "Quel style privilégiez-vous pour ce lancement ?",
        gauges: [
            { label: "Culture d'entreprise", valText: "Liberté d'action", desc: "L'entreprise prône historiquement l'autonomie totale et l'initiative.", pct: 10 },
            { label: "Phase actuelle", valText: "Lancement stable", desc: "Phase de démarrage de projet planifié, pas d'urgence absolue.", pct: 20 },
            { label: "Maturité équipe", valText: "Débutante (D1)", desc: "Les membres ne se connaissent pas encore, les méthodes divergent.", pct: 15 }
        ],
        // Longueurs strictement égales : 89 caractères
        options: [
            { texte: "S2 Persuasif - Expliquer les méthodes, donner du sens et créer la dynamique de groupe.", bonne: true },
            { texte: "S4 Délégatif - Faire confiance à leurs expertises et les laisser s'organiser librement.", bonne: false },
            { texte: "S3 Participatif - Leur demander de définir collectivement leurs propres règles de base.", bonne: false }
        ],
        fbJuste: "<div class='mb-2 text-slate-700'><strong class='text-success'>Culture vs Équipe :</strong> L'entreprise prône l'autonomie, mais l'équipe est Débutante (D1). <em>L'immaturité annule la culture de liberté.</em></div><div class='text-slate-700'><strong class='text-success'>Phase vs Équipe :</strong> Le lancement est stable, on a le temps d'expliquer. Il faut un <strong>style Persuasif (S2)</strong> pour structurer, rassurer et donner du sens.</div>",
        fbFaux: "<div class='mb-2 text-slate-700'><strong class='text-error'>Erreur d'arbitrage :</strong> Vous avez suivi la culture de liberté. Mais l'équipe est Débutante (15%) et ne se connaît pas ! <em>L'immaturité annule la culture d'entreprise.</em></div><div class='text-slate-700'>Laisser une équipe novice s'organiser seule mène au chaos. Il fallait cadrer et donner du sens avec un <strong>style Persuasif (S2)</strong>.</div>"
    }
];

let currentIndex = 0;
let totalScore = 0;

const sfx = {
    initialized: false,
    init: async function() {
        if(this.initialized) return;
        this.initialized = true;
        await Tone.start();
        this.success = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "sine" }, envelope: { attack: 0.01, decay: 0.4, sustain: 0, release: 0.1 } }).toDestination();
        this.success.volume.value = -20;
        this.error = new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.05, decay: 0.2, sustain: 0, release: 0.1 } }).toDestination();
        this.error.volume.value = -18;
        this.click = new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.01 } }).toDestination();
        this.click.volume.value = -25;
    },
    playSuccess: function() { if(this.initialized){ const n = Tone.now(); this.success.triggerAttackRelease("C5", "16n", n); this.success.triggerAttackRelease("G5", "16n", n+0.1); } },
    playError: function() { if(this.initialized) this.error.triggerAttackRelease("C3", "16n"); },
    playClick: function() { if(this.initialized) this.click.triggerAttackRelease("C6", "32n"); }
};
document.addEventListener('click', () => sfx.init(), { once: true });

function shuffleArray(arr) {
    let s = [...arr];
    for (let i = s.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [s[i], s[j]] = [s[j], s[i]]; }
    return s;
}

function initDots() {
    const wrap = document.getElementById("prog-dots");
    wrap.innerHTML = "";
    SCENARIOS.forEach((_, i) => { wrap.innerHTML += `<div class="step-dot" id="dot-${i}"></div>`; });
}

function majProgression() {
    document.getElementById("prog-label").textContent = `Scénario ${currentIndex + 1} sur ${SCENARIOS.length}`;
    document.getElementById("prog-bar").style.width = `${(currentIndex / SCENARIOS.length) * 100}%`;
    SCENARIOS.forEach((_, i) => {
        const d = document.getElementById(`dot-${i}`);
        if (i < currentIndex) d.className = "step-dot done";
        else if (i === currentIndex) d.className = "step-dot actif";
        else d.className = "step-dot";
    });
}

function genererDashboard(gaugesData) {
    return gaugesData.map(g => `
        <div class="flex flex-col gap-2">
            <div class="flex justify-between items-end w-full">
                <span class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">${g.label}</span>
                <span class="text-[11px] font-bold text-accent uppercase tracking-wider">${g.valText}</span>
            </div>
            <!-- Grande jauge (La classe gauge-fill est essentielle pour l'animation) -->
            <div class="w-full h-14 bg-slate-200 rounded-full relative overflow-hidden shadow-inner border border-slate-100">
                <div class="gauge-fill absolute top-0 left-0 bottom-0 bg-gradient-to-r from-brand to-accent rounded-full transition-all duration-1000 ease-[cubic-bezier(0.34,1.56,0.64,1)]" style="width: 0%" data-target="${g.pct}%"></div>
            </div>
            <div class="text-[11px] text-slate-500 font-medium leading-snug px-1">${g.desc}</div>
        </div>
    `).join("");
}

function afficherScenario() {
    majProgression();
    const data = SCENARIOS[currentIndex];
    const zone = document.getElementById("zone-dynamique");
    const optionsMelangees = shuffleArray(data.options);

    const optsHTML = optionsMelangees.map((opt, idx) => {
        const parts = opt.texte.split(" - ");
        const formattedText = parts.length > 1 ? `<strong class="text-slate-900">${parts[0]}</strong> - ${parts[1]}` : opt.texte;
        return `
            <button class="btn-choix group" id="opt-${idx}" onclick="validerChoix(${idx}, ${opt.bonne}, ${JSON.stringify(optionsMelangees).replace(/"/g, '&quot;')})">
                <div class="lettre-bulle">${['A', 'B', 'C'][idx]}</div>
                <span class="leading-relaxed flex-1">${formattedText}</span>
            </button>
        `;
    }).join("");

    zone.innerHTML = `
        <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden animate-slide-up flex flex-col md:flex-row">
            
            <!-- PANEL GAUCHE : LE DASHBOARD -->
            <div class="w-full md:w-5/12 bg-slate-50 border-b md:border-b-0 md:border-r border-slate-200 p-6 md:p-8 flex flex-col relative overflow-hidden">
                <div class="absolute -bottom-20 -left-20 w-64 h-64 bg-accent/5 rounded-full blur-3xl pointer-events-none"></div>
                
                <div class="flex items-center gap-2 mb-8 relative z-10">
                    <svg class="w-5 h-5 text-accent" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
                    <h3 class="font-bold text-accent uppercase tracking-widest text-xs">Données contextuelles</h3>
                </div>
                <div class="flex-1 flex flex-col gap-6 justify-center relative z-10">
                    ${genererDashboard(data.gauges)}
                </div>
            </div>
            
            <!-- PANEL DROIT : LE SCÉNARIO -->
            <div class="w-full md:w-7/12 p-6 md:p-8 flex flex-col">
                <h2 class="text-xl font-bold text-brand mb-3">${data.titre}</h2>
                <p class="text-slate-600 italic leading-relaxed text-[15px] border-l-2 border-brand/30 pl-4 mb-6">
                    ${data.contexte}
                </p>
                
                <h3 class="text-base font-bold text-slate-800 mb-4">${data.consigne}</h3>
                
                <div class="flex flex-col gap-3">
                    ${optsHTML}
                </div>
                
                <div class="mt-6 rounded-xl p-5 text-sm md:text-[15px] leading-relaxed hidden animate-fade-in" id="feedback-box"></div>
                
                <button class="hidden w-full bg-accent hover:bg-accent-hover text-white font-bold py-4 rounded-xl transition-all active:scale-[0.98] shadow-md shadow-accent/20 items-center justify-center gap-2 mt-6" id="btn-suivant" onclick="etapeSuivante()">
                    ${currentIndex < SCENARIOS.length - 1 ? "Analyser la situation suivante" : "Voir les règles d'arbitrage"}
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                </button>
            </div>
        </div>
    `;

    // Animation des jauges après un court délai pour laisser le DOM s'afficher
    setTimeout(() => {
        document.querySelectorAll('.gauge-fill').forEach(fill => {
            fill.style.width = fill.getAttribute('data-target');
        });
    }, 100);
}

function validerChoix(idxClique, estJuste, optionsMelangees) {
    if(estJuste) { sfx.playSuccess(); totalScore++; } else { sfx.playError(); }

    optionsMelangees.forEach((opt, idx) => {
        const btn = document.getElementById(`opt-${idx}`);
        btn.disabled = true;
        if (idx === idxClique) btn.className = estJuste ? "btn-choix juste" : "btn-choix faux";
        else if (opt.bonne && !estJuste) btn.className = "btn-choix juste";
        else btn.className = "btn-choix neutre-apres";
    });

    const data = SCENARIOS[currentIndex];
    const fb = document.getElementById("feedback-box");
    fb.className = estJuste 
        ? "mt-6 rounded-xl p-5 text-[15px] leading-relaxed block animate-fade-in bg-success-bg border border-success-border text-success-text"
        : "mt-6 rounded-xl p-5 text-[15px] leading-relaxed block animate-fade-in bg-error-bg border border-error-border text-error-text";
    
    const iconHtml = estJuste 
        ? `<svg class="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>`
        : `<svg class="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>`;

    fb.innerHTML = `<div class="font-bold mb-3 flex items-center gap-1">${iconHtml} ${estJuste ? 'Arbitrage réussi' : 'Conflit non résolu'}</div>${estJuste ? data.fbJuste : data.fbFaux}`;

    const btnSuiv = document.getElementById("btn-suivant");
    btnSuiv.classList.remove("hidden");
    btnSuiv.classList.add("flex");
    setTimeout(() => btnSuiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
}

function etapeSuivante() {
    sfx.playClick();
    currentIndex++;
    if (currentIndex < SCENARIOS.length) {
        afficherScenario();
        setTimeout(() => document.getElementById("progression-container").scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
    } else {
        afficherBilan();
    }
}

function afficherBilan() {
    document.getElementById("progression-container").style.display = "none";

    const msgScore = totalScore === SCENARIOS.length 
        ? "Parfaite maîtrise ! Vous savez identifier la variable qui compte le plus dans chaque contexte." 
        : "L'arbitrage est subtil. Retenez bien les deux règles d'or ci-dessous pour ne plus tomber dans le piège.";

    document.getElementById("zone-dynamique").innerHTML = `
        <div class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden animate-slide-up w-full mt-2">
            <div class="bg-brand p-8 text-white text-center relative overflow-hidden">
                <div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
                <div class="relative z-10">
                    <svg class="w-12 h-12 mx-auto mb-3 text-white" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></svg>
                    <h2 class="text-2xl font-bold mb-2">Bilan des arbitrages</h2>
                    <div class="flex items-baseline justify-center gap-1 mb-4">
                        <span class="text-5xl font-black text-brand-light">${totalScore}</span>
                        <span class="text-xl text-white/60 font-medium">/ ${SCENARIOS.length}</span>
                    </div>
                    <p class="text-white/80 max-w-lg mx-auto text-sm leading-relaxed">${msgScore}</p>
                </div>
            </div>
            
            <div class="p-6 md:p-8">
                <div class="bg-slate-50 border-l-4 border-accent rounded-r-xl p-6 mb-8 text-slate-700 leading-relaxed shadow-sm">
                    Dans la vraie vie, la Culture, la Phase et l'Équipe pointent rarement dans la même direction. Face à ces contradictions, le manager doit appliquer des <strong>règles de priorité</strong>.
                </div>

                <h3 class="text-brand font-bold uppercase tracking-widest text-xs mb-4 text-center">Les 2 règles d'or de l'arbitrage</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                    <!-- Règle 1 -->
                    <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                        <div class="w-10 h-10 rounded-full bg-accent/10 text-accent flex items-center justify-center mb-3">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
                        </div>
                        <h4 class="font-bold text-slate-800 mb-2">L'Urgence annule la Culture</h4>
                        <p class="text-slate-600 text-sm leading-relaxed">Une crise vitale exige toujours un cap directif et immédiat (S1), même si l'entreprise est la reine de la "culture plate" et du collaboratif.</p>
                    </div>
                    <!-- Règle 2 -->
                    <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                        <div class="w-10 h-10 rounded-full bg-accent/10 text-accent flex items-center justify-center mb-3">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        </div>
                        <h4 class="font-bold text-slate-800 mb-2">La Maturité annule la Hiérarchie</h4>
                        <p class="text-slate-600 text-sm leading-relaxed">Une équipe soudée et experte mérite qu'on lui délègue le pouvoir (S4), même si elle travaille dans un environnement ultra-bureaucratique.</p>
                    </div>
                </div>
                
                <button class="w-full bg-white border-2 border-brand text-brand hover:bg-brand hover:text-white font-bold py-4 rounded-xl transition-all shadow-sm flex items-center justify-center gap-2 group" onclick="recommencer()">
                    <svg class="w-5 h-5 group-hover:-rotate-180 transition-transform duration-500" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    Refaire une analyse
                </button>
            </div>
        </div>
    `;
    setTimeout(() => window.scrollTo({ top: 0, behavior: 'smooth' }), 100);
}

function recommencer() {
    sfx.playClick();
    currentIndex = 0;
    totalScore = 0;
    document.getElementById("progression-container").style.display = "flex";
    afficherScenario();
    window.scrollTo({ top: 0, behavior: "smooth" });
}

const btnFs = document.getElementById('btn-fullscreen');
const iconEnter = document.getElementById('icon-fs-enter');
const iconExit = document.getElementById('icon-fs-exit');
let isPseudoFs = false;

function updateFsIcons() { const isFs = document.fullscreenElement || document.webkitFullscreenElement || isPseudoFs; iconEnter.classList.toggle('hidden', !!isFs); iconExit.classList.toggle('hidden', !isFs); }
function enablePseudoFs()  { isPseudoFs = true;  document.body.classList.add('pseudo-fullscreen');    updateFsIcons(); }
function disablePseudoFs() { isPseudoFs = false; document.body.classList.remove('pseudo-fullscreen'); updateFsIcons(); }

btnFs.addEventListener('click', (e) => {
    e.stopPropagation(); sfx.playClick();
    if (!document.fullscreenElement && !document.webkitFullscreenElement && !isPseudoFs) {
        const el = document.documentElement;
        const fn = el.requestFullscreen || el.webkitRequestFullscreen;
        if (fn) { try { const p = fn.call(el); if (p && p.catch) p.catch(() => enablePseudoFs()); setTimeout(() => { if (!document.fullscreenElement && !document.webkitFullscreenElement && !isPseudoFs) enablePseudoFs(); }, 300); } catch { enablePseudoFs(); } }
        else enablePseudoFs();
    } else { if (isPseudoFs) disablePseudoFs(); else { const fn = document.exitFullscreen || document.webkitExitFullscreen; if (fn) try { fn.call(document); } catch { disablePseudoFs(); } } }
});

document.addEventListener('fullscreenchange', updateFsIcons);
document.addEventListener('webkitfullscreenchange', updateFsIcons);

/* INIT */
initDots();
afficherScenario();
</script>
