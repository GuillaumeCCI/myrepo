<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Écoute active ou écoute de façade ?</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { DEFAULT: '#000099', light: '#e6e6ff', hover: '#0000cc' },
                        accent: { DEFAULT: '#810464', hover: '#64034e', light: '#fdf2f8' },
                        success: { DEFAULT: '#10b981', bg: '#ecfdf5', text: '#065f46', border: '#6ee7b7' },
                        error: { DEFAULT: '#ef4444', bg: '#fef2f2', text: '#991b1b', border: '#fca5a5' }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out forwards',
                        'slide-up': 'slideUp 0.4s ease-out forwards',
                        'pop': 'pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards'
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(15px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        pop: { '0%': { transform: 'scale(0.95)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } }
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer components {
            .btn-choix {
                @apply flex flex-col items-center justify-center gap-3 p-5 border-2 border-slate-200 rounded-2xl bg-slate-50 cursor-pointer transition-all duration-300 text-center w-full shadow-sm;
            }
            .btn-choix:hover:not(:disabled) {
                @apply border-brand bg-brand-light/30 transform -translate-y-1 shadow-md text-brand;
            }
            .btn-choix:disabled { @apply cursor-default transform-none; }
            
            .btn-choix.juste { @apply border-success bg-success-bg text-success-text shadow-none ring-2 ring-success/20 font-bold; }
            .btn-choix.faux { @apply border-error bg-error-bg text-error-text opacity-70; }
            .btn-choix.neutre-apres { @apply opacity-40 grayscale bg-slate-100 border-slate-200; }

            .step-dot { @apply w-2 h-2 md:w-2.5 md:h-2.5 rounded-full bg-slate-200 transition-all duration-300; }
            .step-dot.actif { @apply bg-brand ring-4 ring-brand-light scale-110; }
            .step-dot.done-juste { @apply bg-success shadow-[0_0_8px_rgba(16,185,129,0.5)]; }
            .step-dot.done-faux { @apply bg-error; }
            
            .bubble-client { @apply bg-slate-100 text-slate-700 rounded-2xl rounded-tl-none p-4 text-[15px] leading-relaxed border border-slate-200 shadow-sm relative; }
            .bubble-conseiller { @apply bg-brand-light/30 border border-brand/20 rounded-2xl rounded-tr-none p-4 text-[15px] leading-relaxed text-brand-hover shadow-sm relative; }
        }

        /* Force l'ascenseur interne pour Genially */
        html { height: 100%; overflow: hidden; }
        body {
            height: 100%; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
        }
        body.pseudo-fullscreen {
            position: fixed !important; top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important;
            z-index: 999999 !important; margin: 0 !important;
        }
    </style>
</head>
<body class="text-slate-800 font-sans p-4 md:p-8 flex flex-col items-center pb-24">

    <!-- Bouton Plein Écran -->
    <button id="btn-fullscreen" class="fixed top-4 right-4 z-50 bg-white p-3 rounded-full shadow-lg border border-slate-200 text-brand hover:bg-brand hover:text-white transition-all group" title="Plein écran">
        <svg id="icon-fs-enter" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        <svg id="icon-fs-exit" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>
    </button>

    <!-- Overlay Spotlight -->
    <div id="spotlight-overlay" class="fixed inset-0 z-40 transition-opacity duration-1000 pointer-events-none flex items-start justify-end" style="background: radial-gradient(circle at calc(100% - 2.5rem) 2.5rem, transparent 32px, rgba(15, 23, 42, 0.75) 50px);">
        <div class="mr-[4.5rem] mt-[4.5rem] text-white font-medium text-sm flex items-center gap-3 animate-pulse bg-brand/90 py-2 px-4 rounded-xl backdrop-blur-sm border border-white/20 shadow-2xl">
            <span>Passer en plein écran</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M7 17L17 7"/><path d="M7 7h10v10"/></svg>
        </div>
    </div>

    <main class="w-full max-w-3xl flex flex-col gap-6 animate-fade-in mt-14 md:mt-0">
        
        <!-- HEADER -->
        <header class="bg-brand text-white rounded-3xl p-6 md:p-8 shadow-xl shadow-brand/10 flex flex-col md:flex-row items-start md:items-center gap-5 relative overflow-hidden">
            <div class="absolute -top-12 -right-12 w-40 h-40 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
            <div class="w-14 h-14 min-w-[56px] bg-white text-brand rounded-2xl flex items-center justify-center shadow-sm z-10">
                <!-- Icône Casque Professionnel -->
                <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
            </div>
            <div class="z-10 flex-1">
                <div class="text-brand-light text-xs font-bold tracking-widest uppercase mb-1">Entraînement : Les réflexes d'écoute</div>
                <h1 class="text-2xl md:text-3xl font-extrabold leading-tight mb-2">Écoute active ou de façade ?</h1>
                <div class="text-white/80 text-sm font-medium">Lisez l'échange et évaluez la réaction du conseiller.</div>
            </div>
        </header>

        <!-- PROGRESSION -->
        <div class="w-full flex flex-col gap-3 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm" id="progression-container">
            <div class="flex justify-between items-end text-sm">
                <span class="font-bold text-slate-500 uppercase tracking-wider text-xs" id="prog-label">Cas 1 sur 8</span>
                <span class="font-bold text-brand bg-brand-light px-3 py-1 rounded-full text-xs" id="prog-score">Score : 0 / 8</span>
            </div>
            <div class="h-2 bg-slate-100 rounded-full overflow-hidden shadow-inner">
                <div class="h-full bg-brand rounded-full transition-all duration-500" id="prog-bar" style="width:0%"></div>
            </div>
            <div class="flex gap-2 justify-center mt-1" id="prog-dots"></div>
        </div>

        <!-- ZONE DYNAMIQUE -->
        <div id="zone-dynamique" class="w-full"></div>

    </main>

<script>
const SCENARIOS = [
    {
        type: "Cas net", difficulte: "bg-brand/10 text-brand border-brand/20",
        dialogue: [
            { locuteur: "client", texte: "Bonjour, j'ai reçu ma commande mais il manque une pièce, et je ne sais pas trop..." },
            { locuteur: "conseiller", texte: "Pas de souci, je vous envoie la pièce manquante dès aujourd'hui, ça vous va ?" }
        ],
        bonneReponse: "facade",
        fbJuste: "Le conseiller n'a pas laissé le client terminer sa phrase. Il propose déjà une solution avant même de savoir ce que le client voulait réellement exprimer (une autre demande, une inquiétude, etc.).",
        fbFaux: "Le conseiller coupe la parole avant la fin de la phrase du client. Proposer une solution à ce stade, c'est répondre à une demande qu'on a supposée plutôt qu'entendue en entier."
    },
    {
        type: "Cas net", difficulte: "bg-brand/10 text-brand border-brand/20",
        dialogue: [
            { locuteur: "client", texte: "En fait le problème, c'est que la pièce manquante bloque tout le montage, et j'en ai besoin pour ce week-end." },
            { locuteur: "conseiller", texte: "Si je comprends bien, ce n'est pas juste la pièce en tant que telle : c'est surtout le délai qui vous inquiète pour le week-end." }
        ],
        bonneReponse: "active",
        fbJuste: "Le conseiller laisse le client exposer la situation complète, puis reformule en faisant ressortir le vrai enjeu (le délai), pas seulement le fait matériel. C'est une reformulation qui ajoute de la compréhension.",
        fbFaux: "Ici la reformulation ne se contente pas de répéter les mots : elle identifie l'enjeu réel derrière la demande (le délai). C'est le signe d'une véritable écoute active."
    },
    {
        type: "Cas net", difficulte: "bg-brand/10 text-brand border-brand/20",
        dialogue: [
            { locuteur: "client", texte: "Je voulais vous parler de..." },
            // Correction de la coquille ici: 'text' devient 'texte'
            { locuteur: "conseiller", texte: "Vous appelez pour un retour produit ?" }
        ],
        bonneReponse: "facade",
        fbJuste: "Question fermée, posée avant même que le client ait terminé sa phrase. Le conseiller devine et oriente au lieu de laisser le client formuler sa propre demande.",
        fbFaux: "Le conseiller interrompt une phrase inachevée avec une question fermée qui présuppose déjà le sujet. Le client n'a pas eu l'occasion de dire ce qu'il voulait exprimer."
    },
    {
        type: "Cas nuancé", difficulte: "bg-amber-50 text-amber-700 border-amber-200",
        dialogue: [
            { locuteur: "client", texte: "Le service ne fonctionne plus depuis hier, et j'ai déjà contacté deux fois le support sans réponse claire." },
            { locuteur: "conseiller", texte: "Donc si je comprends bien, vous avez un problème avec le service." }
        ],
        bonneReponse: "facade",
        fbJuste: "La formule ressemble à une reformulation, mais elle ne fait que répéter le sujet en le vidant de son contenu : la panne, les relances, la frustration... tout a disparu.",
        fbFaux: "C'est le piège de la reformulation mécanique. Son contenu est appauvri au point de ne plus rien redire des faits ni de la frustration exprimée. C'est une écoute de surface."
    },
    {
        type: "Cas nuancé", difficulte: "bg-amber-50 text-amber-700 border-amber-200",
        dialogue: [
            { locuteur: "client", texte: "Honnêtement, ça fait trois fois que je dois recontacter le service pour la même panne, c'est fatigant." },
            { locuteur: "conseiller", texte: "Vous êtes d'accord que ce genre de souci arrive de temps en temps, même avec le meilleur service ?" }
        ],
        bonneReponse: "facade",
        fbJuste: "C'est une question fermée déguisée : elle invite le client à minimiser sa propre frustration et cherche son assentiment sur une idée posée par le conseiller.",
        fbFaux: "La question a la forme d'une ouverture, mais elle oriente déjà la réponse attendue : elle ne cherche pas à comprendre ce que vit le client, mais à justifier le problème."
    },
    {
        type: "Cas nuancé", difficulte: "bg-amber-50 text-amber-700 border-amber-200",
        dialogue: [
            { locuteur: "client", texte: "Ce qui m'embête surtout, c'est que je n'ai aucune nouvelle depuis mon message, alors que j'ai vraiment besoin d'une réponse rapide pour organiser la suite." },
            { locuteur: "conseiller", texte: "Vous vous sentez laissé sans réponse, et ça vous met en difficulté pour la suite. Je comprends, on va reprendre ça depuis le début." }
        ],
        bonneReponse: "active",
        fbJuste: "Le conseiller reformule non seulement les faits (l'absence de réponse) mais aussi l'impact ressenti (la difficulté pour organiser la suite). L'écoute est complète.",
        fbFaux: "La reformulation va au-delà des faits : elle nomme l'impact concret pour le client. C'est le signe d'une écoute qui cherche le sens complet du message."
    },
    {
        type: "Cas piège", difficulte: "bg-accent/10 text-accent border-accent/20",
        dialogue: [
            { locuteur: "client", texte: "Bonjour, je vous appelle parce que..." },
            { locuteur: "conseiller", texte: "Je comprends tout à fait, c'est une situation frustrante." }
        ],
        bonneReponse: "facade",
        fbJuste: "La formule sonne empathique, mais elle arrive avant que le client ait dit quoi que ce soit ! C'est une empathie de réflexe, pas une empathie fondée sur une écoute.",
        fbFaux: "C'est le piège du vocabulaire empathique employé trop tôt : « je comprends » sonne bien, mais le client n'a encore rien exprimé. Cette phrase est récitée machinalement."
    },
    {
        type: "Cas piège", difficulte: "bg-accent/10 text-accent border-accent/20",
        dialogue: [
            { locuteur: "client", texte: "Ce qui me gêne, c'est que l'abonnement pris ne correspond plus du tout à mon usage actuel, j'aimerais revoir la formule." },
            { locuteur: "conseiller", texte: "Je note, je note. Justement, on a une nouvelle offre premium avec plus d'options, ça pourrait vous intéresser ?" }
        ],
        bonneReponse: "facade",
        fbJuste: "Les signaux d'attention sont là (« je note »), mais la réponse ignore totalement ce que le client vient de dire (il veut un ajustement, pas nécessairement plus d'options).",
        fbFaux: "Les marqueurs verbaux d'attention sont présents (« je note »), mais la proposition commerciale qui suit ignore le sens de la demande. Le signal d'écoute est décorrélé de l'écoute réelle."
    }
];

let currentIndex = 0;
let totalScore = 0;
let historiquesReponses = [];

const sfx = {
    initialized: false,
    init: async function() {
        if(this.initialized) return;
        this.initialized = true;
        await Tone.start();
        this.success = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "sine" }, envelope: { attack: 0.01, decay: 0.4, sustain: 0, release: 0.1 } }).toDestination();
        this.success.volume.value = -25;
        this.error = new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.05, decay: 0.2, sustain: 0, release: 0.1 } }).toDestination();
        this.error.volume.value = -20;
        this.click = new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.01 } }).toDestination();
        this.click.volume.value = -30;
    },
    playSuccess: function() { if(this.initialized) { const n = Tone.now(); this.success.triggerAttackRelease("C5", "16n", n); this.success.triggerAttackRelease("G5", "16n", n+0.1); } },
    playError: function() { if(this.initialized) this.error.triggerAttackRelease("C3", "16n"); },
    playClick: function() { if(this.initialized) this.click.triggerAttackRelease("C6", "32n"); }
};
document.addEventListener('click', () => sfx.init(), { once: true });

function initDots() {
    const wrap = document.getElementById("prog-dots");
    wrap.innerHTML = "";
    SCENARIOS.forEach((_, i) => { wrap.innerHTML += `<div class="step-dot" id="dot-${i}"></div>`; });
}

function majProgression() {
    document.getElementById("prog-label").textContent = `Cas ${currentIndex + 1} sur ${SCENARIOS.length}`;
    document.getElementById("prog-score").textContent = `Score : ${totalScore} / ${SCENARIOS.length}`;
    document.getElementById("prog-bar").style.width = `${(currentIndex / SCENARIOS.length) * 100}%`;
    
    for(let i=0; i<SCENARIOS.length; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if(i === currentIndex) {
            dot.className = "step-dot actif";
        } else if (i < currentIndex) {
            dot.className = historiquesReponses[i] ? "step-dot done-juste" : "step-dot done-faux";
        } else {
            dot.className = "step-dot";
        }
    }
}

function afficherScenario() {
    majProgression();
    const data = SCENARIOS[currentIndex];
    const zone = document.getElementById("zone-dynamique");

    const dialogueHTML = data.dialogue.map(l => `
        <div class="flex gap-3 mb-4 ${l.locuteur === 'conseiller' ? 'flex-row-reverse' : ''}">
            <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-xs flex-shrink-0 shadow-sm ${l.locuteur === 'conseiller' ? 'bg-brand text-white' : 'bg-slate-200 text-slate-500'}">
                ${l.locuteur === 'conseiller' ? 'Co.' : 'Cl.'}
            </div>
            <div class="max-w-[85%] ${l.locuteur === 'conseiller' ? 'bubble-conseiller' : 'bubble-client'}">
                ${l.texte}
            </div>
        </div>
    `).join("");

    zone.innerHTML = `
        <div class="bg-white border border-slate-200 rounded-3xl shadow-sm overflow-hidden animate-slide-up">
            
            <div class="bg-slate-50 border-b border-slate-100 px-6 py-4 flex justify-between items-center">
                <span class="text-xs font-bold tracking-widest uppercase text-slate-400">Échange vocal</span>
                <span class="text-[10px] font-bold tracking-wider uppercase px-3 py-1 rounded-full border ${data.difficulte}">${data.type}</span>
            </div>
            
            <div class="p-6 md:p-8">
                
                <div class="mb-8 relative">
                    <!-- Suppression du trait vertical "timeline" pour un design plus propre -->
                    ${dialogueHTML}
                </div>
                
                <h3 class="text-center font-bold text-slate-800 mb-4 text-sm uppercase tracking-wider">Évaluation de la réaction</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <button class="btn-choix group" id="btn-active" onclick="validerChoix('active')">
                        <div class="w-12 h-12 rounded-full bg-white shadow-sm flex items-center justify-center text-brand group-hover:bg-brand group-hover:text-white transition-colors mb-1">
                            <!-- SVG Écoute Active : Bulle de dialogue avec coeur -->
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M15.8 9.2a2.5 2.5 0 0 0-3.5 0l-.3.4-.3-.4a2.5 2.5 0 0 0-3.5 3.5l3.8 3.8 3.8-3.8a2.5 2.5 0 0 0 0-3.5Z"/></svg>
                        </div>
                        <span class="font-bold text-slate-700 text-[15px] choix-titre">Écoute active</span>
                    </button>
                    
                    <button class="btn-choix group" id="btn-facade" onclick="validerChoix('facade')">
                        <div class="w-12 h-12 rounded-full bg-white shadow-sm flex items-center justify-center text-brand group-hover:bg-brand group-hover:text-white transition-colors mb-1">
                            <!-- SVG Écoute de façade : Robot mécanique -->
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
                        </div>
                        <span class="font-bold text-slate-700 text-[15px] choix-titre">Écoute de façade</span>
                    </button>
                </div>
                
                <div class="mt-6 rounded-xl p-5 text-[15px] leading-relaxed hidden animate-fade-in" id="feedback-box"></div>
                
                <button class="hidden w-full bg-accent hover:bg-accent-hover text-white font-bold py-4 rounded-xl transition-all active:scale-[0.98] shadow-md items-center justify-center gap-2 mt-6" id="btn-suivant" onclick="etapeSuivante()">
                    ${currentIndex < SCENARIOS.length - 1 ? "Évaluer l'échange suivant" : "Voir mon bilan d'écoute"}
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                </button>
            </div>
        </div>
    `;
}

function validerChoix(choix) {
    const data = SCENARIOS[currentIndex];
    const estJuste = choix === data.bonneReponse;

    if (estJuste) {
        sfx.playSuccess();
        totalScore++;
    } else {
        sfx.playError();
    }
    
    historiquesReponses[currentIndex] = estJuste;

    const btnA = document.getElementById("btn-active");
    const btnF = document.getElementById("btn-facade");
    
    btnA.disabled = true;
    btnF.disabled = true;

    if (choix === "active") {
        btnA.className = estJuste ? "btn-choix juste" : "btn-choix faux";
        btnF.className = estJuste ? "btn-choix neutre-apres" : "btn-choix juste";
    } else {
        btnF.className = estJuste ? "btn-choix juste" : "btn-choix faux";
        btnA.className = estJuste ? "btn-choix neutre-apres" : "btn-choix juste";
    }

    const fb = document.getElementById("feedback-box");
    fb.className = estJuste 
        ? "mt-6 rounded-xl p-5 text-[15px] leading-relaxed block animate-fade-in bg-success-bg border border-success-border text-success-text"
        : "mt-6 rounded-xl p-5 text-[15px] leading-relaxed block animate-fade-in bg-error-bg border border-error-border text-error-text";
    
    const iconHtml = estJuste 
        ? `<svg class="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>`
        : `<svg class="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>`;

    fb.innerHTML = `<div class="font-bold mb-2 flex items-center gap-1">${iconHtml} ${estJuste ? 'Lecture fine' : 'À reconsidérer'}</div>${estJuste ? data.fbJuste : data.fbFaux}`;

    const btnSuiv = document.getElementById("btn-suivant");
    btnSuiv.classList.remove("hidden");
    btnSuiv.classList.add("flex");
    setTimeout(() => btnSuiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
    
    majProgression();
}

function etapeSuivante() {
    sfx.playClick();
    currentIndex++;
    if (currentIndex < SCENARIOS.length) {
        afficherScenario();
        setTimeout(() => document.getElementById("progression-container").scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
    } else {
        afficherBilan();
    }
}

function afficherBilan() {
    document.getElementById("progression-container").style.display = "none";
    document.getElementById("zone-dynamique").style.display = "none";

    let msgTitre, msgTxt;
    if (totalScore >= 7) {
        msgTitre = "Lecture fine des situations";
        msgTxt = "Vous avez distingué de façon quasi systématique les signaux de surface du contenu réel de la réponse. C'est exactement ce qui différencie l'écoute active de sa simple apparence.";
    } else if (totalScore >= 4) {
        msgTitre = "Lecture partielle";
        msgTxt = "Les cas nets ont été bien identifiés, mais certains cas nuancés ou pièges ont été classés sur la base des mots employés par le conseiller (« je comprends », « je note ») plutôt que sur ce que sa réponse faisait réellement avec la parole du client.";
    } else {
        msgTitre = "À reprendre";
        msgTxt = "Le tri s'est appuyé principalement sur le ton ou le vocabulaire employé, qui est justement le terrain le plus trompeur : une formule empathique peut être présente sans qu'il y ait d'écoute réelle derrière.";
    }

    const html = `
        <div class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden animate-slide-up w-full mt-2">
            <div class="bg-brand p-8 text-white text-center relative overflow-hidden">
                <div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
                <div class="relative z-10">
                    <!-- SVG Trophée (Bilan) -->
                    <svg class="w-12 h-12 mx-auto mb-4 text-white" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
                    <h2 class="text-2xl font-bold mb-2">Bilan de l'écoute</h2>
                    <div class="flex items-baseline justify-center gap-1 mb-4">
                        <span class="text-5xl font-black text-brand-light">${totalScore}</span>
                        <span class="text-xl text-white/60 font-medium">/ ${SCENARIOS.length}</span>
                    </div>
                    <div class="inline-flex bg-white/20 px-4 py-1.5 rounded-full text-sm font-bold tracking-wide uppercase mb-3">${msgTitre}</div>
                    <p class="text-white/80 max-w-lg mx-auto text-sm leading-relaxed">${msgTxt}</p>
                </div>
            </div>
            
            <div class="p-6 md:p-8">
                <div class="bg-slate-50 border-l-4 border-brand rounded-r-xl p-6 mb-8 text-slate-700 leading-relaxed shadow-sm">
                    <h4 class="font-bold text-brand mb-2 text-sm uppercase tracking-widest">Ce que ces 8 cas montrent</h4>
                    L'écoute active ne se reconnaît pas à des signaux de surface (hocher la tête, dire « je comprends », prendre des notes) mais à <strong>ce que ces gestes produisent réellement</strong> : le client a-t-il pu aller au bout de son idée, et la réponse du conseiller en tient-elle compte sur le fond ?
                </div>
                
                <button class="w-full bg-white border-2 border-brand text-brand hover:bg-brand hover:text-white font-bold py-4 rounded-xl transition-all shadow-sm flex items-center justify-center gap-2 group" onclick="recommencer()">
                    <svg class="w-5 h-5 group-hover:-rotate-180 transition-transform duration-500" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    Refaire l'analyse
                </button>
            </div>
        </div>
    `;
    
    document.getElementById("zone-dynamique").innerHTML = html;
    document.getElementById("zone-dynamique").style.display = "block";
    setTimeout(() => window.scrollTo({ top: 0, behavior: 'smooth' }), 100);
}

function recommencer() {
    sfx.playClick();
    currentIndex = 0;
    totalScore = 0;
    historiquesReponses = [];
    document.getElementById("progression-container").style.display = "flex";
    afficherScenario();
    window.scrollTo({ top: 0, behavior: "smooth" });
}

const btnFs = document.getElementById('btn-fullscreen');
const iconEnter = document.getElementById('icon-fs-enter');
const iconExit = document.getElementById('icon-fs-exit');
const spotlight = document.getElementById('spotlight-overlay');
let isPseudoFs = false;

function updateFsIcons() { const isFs = document.fullscreenElement || document.webkitFullscreenElement || isPseudoFs; iconEnter.classList.toggle('hidden', !!isFs); iconExit.classList.toggle('hidden', !isFs); }
function enablePseudoFs()  { isPseudoFs = true;  document.body.classList.add('pseudo-fullscreen');    updateFsIcons(); }
function disablePseudoFs() { isPseudoFs = false; document.body.classList.remove('pseudo-fullscreen'); updateFsIcons(); }

btnFs.addEventListener('click', (e) => {
    e.stopPropagation(); sfx.playClick(); hideSpotlight();
    if (!document.fullscreenElement && !document.webkitFullscreenElement && !isPseudoFs) {
        const el = document.documentElement;
        const fn = el.requestFullscreen || el.webkitRequestFullscreen;
        if (fn) { try { const p = fn.call(el); if (p && p.catch) p.catch(() => enablePseudoFs()); setTimeout(() => { if (!document.fullscreenElement && !document.webkitFullscreenElement && !isPseudoFs) enablePseudoFs(); }, 300); } catch { enablePseudoFs(); } }
        else enablePseudoFs();
    } else { if (isPseudoFs) disablePseudoFs(); else { const fn = document.exitFullscreen || document.webkitExitFullscreen; if (fn) try { fn.call(document); } catch { disablePseudoFs(); } } }
});

document.addEventListener('fullscreenchange', updateFsIcons);
document.addEventListener('webkitfullscreenchange', updateFsIcons);

function hideSpotlight() {
    if(spotlight && !spotlight.classList.contains('opacity-0')) {
        spotlight.classList.add('opacity-0');
        setTimeout(() => spotlight.style.display = 'none', 1000);
    }
}
document.addEventListener('click', () => hideSpotlight(), { once: true });

/* INIT */
initDots();
afficherScenario();
</script>
</body>
</html>
