<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Observer les pratiques commerciales</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ajout de Tone.js pour la génération de sons -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            DEFAULT: '#000099',
                            light: '#e6e6ff',
                            hover: '#0000cc',
                        },
                        success: { DEFAULT: '#10b981', bg: '#ecfdf5', text: '#065f46', border: '#6ee7b7' },
                        error: { DEFAULT: '#ef4444', bg: '#fef2f2', text: '#991b1b', border: '#fca5a5' }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out forwards',
                        'slide-up': 'slideUp 0.4s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(15px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer components {
            .btn-choix {
                @apply flex items-center gap-4 p-4 border-2 border-slate-200 rounded-xl bg-slate-50 cursor-pointer transition-all duration-200 text-left w-full text-slate-700;
            }
            .btn-choix:hover:not(:disabled) {
                @apply border-brand bg-brand-light/30 transform -translate-y-0.5 shadow-md;
            }
            .btn-choix:disabled { @apply cursor-default transform-none shadow-none; }
            
            .btn-choix.juste { @apply border-success bg-success-bg text-success shadow-none ring-2 ring-success/20 font-medium; }
            .btn-choix.faux { @apply border-error bg-error-bg text-error opacity-70; }
            .btn-choix.neutre-apres { @apply opacity-40 grayscale bg-slate-100 border-slate-200; }
            
            .lettre-bulle {
                @apply w-8 h-8 rounded-full bg-white shadow-sm border border-slate-200 flex items-center justify-center font-bold text-slate-500 flex-shrink-0 transition-colors;
            }
            .btn-choix.juste .lettre-bulle { @apply bg-success text-white border-success; }
            .btn-choix.faux .lettre-bulle { @apply bg-error text-white border-error; }
            .btn-choix:hover:not(:disabled) .lettre-bulle { @apply text-brand border-brand/30; }

            .step-dot { @apply w-2.5 h-2.5 rounded-full bg-slate-200 transition-all duration-300; }
            .step-dot.actif { @apply bg-brand ring-4 ring-brand-light scale-110; }
            .step-dot.done { @apply bg-brand/40; }
        }

        /* Fix Scroll Genially (Force un ascenseur interne) */
        html {
            height: 100%;
            overflow: hidden;
        }
        
        body {
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* Fallback Plein Ecran Genially */
        body.pseudo-fullscreen {
            position: fixed !important; top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important;
            z-index: 999999 !important; margin: 0 !important;
            border-radius: 0 !important;
        }
    </style>
</head>
<body class="text-slate-800 font-sans p-4 md:p-8 flex flex-col items-center pb-24">

    <!-- Bouton Plein Écran -->
    <button id="btn-fullscreen" class="fixed top-4 right-4 z-50 bg-white p-3 rounded-full shadow-lg border border-slate-200 text-brand hover:bg-brand hover:text-white transition-all group" title="Plein écran">
        <svg id="icon-fs-enter" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        <svg id="icon-fs-exit" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 hidden"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>
    </button>

    <!-- Overlay Spotlight -->
    <div id="spotlight-overlay" class="fixed inset-0 z-40 transition-opacity duration-1000 pointer-events-none flex items-start justify-end" style="background: radial-gradient(circle at calc(100% - 2.5rem) 2.5rem, transparent 32px, rgba(15, 23, 42, 0.75) 50px);">
        <div class="mr-[4.5rem] mt-[4.5rem] text-white font-medium text-sm flex items-center gap-3 animate-pulse bg-brand/90 py-2 px-4 rounded-xl backdrop-blur-sm border border-white/20 shadow-2xl">
            <span>Passer en plein écran</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M7 17L17 7"/><path d="M7 7h10v10"/></svg>
        </div>
    </div>

    <main class="w-full max-w-3xl flex flex-col gap-6 animate-fade-in mt-14 md:mt-0">
        
        <!-- BANDEAU EN-TETE -->
        <header class="bg-brand text-white rounded-3xl p-6 md:p-8 shadow-xl shadow-brand/10 flex flex-col md:flex-row items-start md:items-center gap-5 relative overflow-hidden">
            <div class="absolute -top-12 -right-12 w-40 h-40 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="w-14 h-14 min-w-[56px] bg-white text-brand rounded-2xl flex items-center justify-center shadow-sm z-10">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-7 h-7"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </div>
            <div class="z-10">
                <div class="text-brand-light text-xs font-bold tracking-widest uppercase mb-1">Pratiques commerciales</div>
                <h1 class="text-2xl md:text-3xl font-extrabold leading-tight mb-2">L'art de l'observation</h1>
                <div class="text-white/80 text-sm font-medium">5 situations pratiques : posture et prise de notes</div>
            </div>
        </header>

        <!-- PROGRESSION -->
        <div class="w-full flex flex-col gap-3 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm" id="progression-container">
            <div class="flex justify-between items-end text-sm">
                <span class="font-bold text-brand uppercase tracking-wider text-xs" id="prog-label">Cas 1 sur 5</span>
                <span class="font-bold text-slate-500 bg-slate-100 px-3 py-1 rounded-full text-xs" id="prog-etape">Type : Choix de posture</span>
            </div>
            <div class="h-2 bg-slate-100 rounded-full overflow-hidden shadow-inner relative">
                <div class="absolute top-0 left-0 h-full bg-brand rounded-full transition-all duration-500 ease-out" id="prog-bar" style="width:0%"></div>
            </div>
            <div class="flex gap-2 justify-center mt-1" id="prog-dots"></div>
        </div>

        <!-- ZONE DYNAMIQUE -->
        <div id="zone-dynamique" class="w-full min-h-[400px]"></div>

    </main>

    <script>
        // Exactement 5 cas (Mix de questions Posture et Notes), même longueur pour éviter les biais
        const CASES = [
            {
                type: "posture",
                titre: "Premier contact client",
                contexte: "Un conseiller effectue ses premiers entretiens en autonomie. Vous voulez évaluer son accueil sans modifier la dynamique naturelle de l'échange.",
                consigne: "Quelle posture managériale devez-vous adopter pour cette situation ?",
                options: [
                    { texte: "S'installer en retrait et noter silencieusement sans jamais intervenir.", bonne: true },
                    { texte: "Se présenter comme responsable et rester prêt à relancer le conseiller.", bonne: false },
                    { texte: "Jouer le rôle du client pour tester ses réactions dans un cadre fictif.", bonne: false }
                ],
                fbJuste: "Bonne approche. La posture silencieuse est la seule qui permette d'observer ce qui se passe réellement. Dès que le manager intervient, la situation n'est plus représentative.",
                fbFaux: "La bonne posture est l'observation silencieuse. Dès que le client sait que le responsable peut intervenir, la situation n'est plus représentative du quotidien."
            },
            {
                type: "note",
                titre: "Analyse d'un compte-rendu",
                contexte: "Vous relisez vos notes après avoir observé un entretien de découverte du besoin entre un conseiller et son client.",
                consigne: "Laquelle de ces notes viole une règle d'or de l'observateur ?",
                options: [
                    { texte: "Le client semblait clairement frustré par l'enchaînement des questions.", bonne: true },
                    { texte: "Le conseiller a posé trois questions fermées au tout début de l'échange.", bonne: false },
                    { texte: "Le conseiller a bien reformulé la demande du client avant de faire l'offre.", bonne: false }
                ],
                fbJuste: "Excellent. La règle violée est : <strong>Observer des faits, jamais d'interprétations</strong>. \"Sembler frustré\" est une interprétation. Un fait concret serait : \"Le client a soupiré deux fois\".",
                fbFaux: "La note fautive était celle sur la frustration. La règle d'or violée est : <strong>Observer des faits, jamais d'interprétations</strong>. \"Sembler frustré\" n'est pas un fait observable direct."
            },
            {
                type: "posture",
                titre: "La situation dérape",
                contexte: "Un client devient très agressif. L'échange se tend dangereusement et la relation commerciale avec ce grand compte risque de se rompre.",
                consigne: "Quelle posture managériale devez-vous adopter pour cette situation ?",
                options: [
                    { texte: "Intervenir brièvement pour désamorcer puis laisser le conseiller reprendre.", bonne: true },
                    { texte: "Rester en retrait et noter sans intervenir pour ne pas biaiser la scène.", bonne: false },
                    { texte: "Stopper l'entretien et faire une mise en situation d'entraînement immédiate.", bonne: false }
                ],
                fbJuste: "Bien joué. La règle d'or de non-intervention s'efface devant une priorité majeure : protéger la relation client. L'observation participante permet de sauver l'échange.",
                fbFaux: "La bonne réponse est d'intervenir brièvement (observation participante). Face à un risque majeur de rupture de contrat, le manager doit abandonner sa neutralité pour protéger l'entreprise."
            },
            {
                type: "note",
                titre: "Bilan du traitement d'objection",
                contexte: "Vous analysez un compte-rendu rédigé par un autre manager lors d'une phase de négociation très technique.",
                consigne: "Parmi ces trois notes d'observation, laquelle pose un vrai problème ?",
                options: [
                    { texte: "Il a géré cette objection finale exactement comme il aurait dû le faire.", bonne: true },
                    { texte: "Il a d'abord remercié le client pour sa remarque avant de lui répondre.", bonne: false },
                    { texte: "Le client a dû répéter la même objection après la réponse du conseiller.", bonne: false }
                ],
                fbJuste: "Très bien vu. Règle violée : <strong>Séparer l'observation de l'évaluation</strong>. \"Exactement comme il aurait dû\" est un jugement de valeur. L'observation doit rester une photographie neutre.",
                fbFaux: "La note fautive affirmait qu'il avait fait \"exactement comme il aurait dû\". Règle violée : <strong>Séparer l'observation de l'évaluation</strong>. Les notes doivent être descriptives, pas prescriptives."
            },
            {
                type: "posture",
                titre: "Blocage sur la conclusion",
                contexte: "Un conseiller échoue souvent à conclure ses ventes. Vous voulez travailler cette phase très précise avec lui dans un cadre pédagogique rassurant.",
                consigne: "Quelle posture managériale devez-vous adopter pour cette situation ?",
                options: [
                    { texte: "Jouer soi-même le client et poser des questions pour le forcer à conclure.", bonne: true },
                    { texte: "L'observer sur ses prochains entretiens clients pour lister tous ses écarts.", bonne: false },
                    { texte: "Intervenir lors du prochain vrai rendez-vous pour lui montrer un exemple.", bonne: false }
                ],
                fbJuste: "Exactement. La mise en situation simulée est parfaite pour cibler une compétence précise, autoriser le droit à l'erreur et débriefer sans mettre en danger un vrai client.",
                fbFaux: "Ici, il faut utiliser la mise en situation simulée (le jeu de rôle). Cela permet de s'entraîner spécifiquement sur le point de blocage dans un cadre totalement sécurisé."
            }
        ];

        let currentIndex = 0; // 0 to 4
        let totalScore = 0;

        const sfx = {
            initialized: false,
            init: async function() {
                if (this.initialized) return;
                this.initialized = true;
                await Tone.start();
                
                // Son succès : Une très discrète clochette douce (ondes sinusoïdales, très court)
                this.success = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.01, decay: 0.4, sustain: 0, release: 0.1 }
                }).toDestination();
                this.success.volume.value = -20; // Volume très bas

                // Son erreur : Un petit son grave et feutré (un seul petit "boop" doux)
                this.error = new Tone.Synth({
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.05, decay: 0.2, sustain: 0, release: 0.1 }
                }).toDestination();
                this.error.volume.value = -18; // Volume très bas

                // Son clic : Un tout petit "tic" très bref pour l'interface
                this.click = new Tone.Synth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.01 }
                }).toDestination();
                this.click.volume.value = -25; // Presque inaudible, juste pour marquer le clic
            },
            playSuccess: function() {
                if (!this.initialized) return;
                const now = Tone.now();
                // Deux notes douces très rapides
                this.success.triggerAttackRelease("C5", "16n", now);
                this.success.triggerAttackRelease("G5", "16n", now + 0.1);
            },
            playError: function() {
                if (!this.initialized) return;
                // Un seul petit "boop" feutré
                this.error.triggerAttackRelease("C3", "16n");
            },
            playClick: function() {
                if (!this.initialized) return;
                // Un micro "tic" aigu
                this.click.triggerAttackRelease("C6", "32n");
            }
        };

        // Les navigateurs exigent une interaction utilisateur pour activer l'audio
        document.addEventListener('click', () => sfx.init(), { once: true });

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function initUI() {
            const wrap = document.getElementById("prog-dots");
            wrap.innerHTML = "";
            for (let i = 0; i < CASES.length; i++) {
                wrap.innerHTML += `<div class="step-dot" id="dot-${i}"></div>`;
            }
            afficherEtape();
        }

        function majProgression() {
            document.getElementById("prog-label").textContent = `Cas ${currentIndex + 1} sur 5`;
            document.getElementById("prog-etape").textContent = CASES[currentIndex].type === "posture" ? "Type : Choix de posture" : "Type : Analyse de notes";
            
            const progress = (currentIndex / CASES.length) * 100;
            document.getElementById("prog-bar").style.width = `${progress}%`;

            for (let i = 0; i < CASES.length; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if (i < currentIndex) dot.className = "step-dot done";
                else if (i === currentIndex) dot.className = "step-dot actif";
                else dot.className = "step-dot";
            }
        }

        function afficherEtape() {
            majProgression();
            const data = CASES[currentIndex];
            const zone = document.getElementById("zone-dynamique");

            // Mélanger les options pour éviter les biais de position
            const optionsMelangees = shuffleArray(data.options);
            
            const iconSvg = data.type === "posture" 
                ? `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>`
                : `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>`;

            let optsHTML = optionsMelangees.map((opt, idx) => `
                <button class="btn-choix" id="opt-${idx}" onclick="validerChoix(${idx}, ${opt.bonne}, ${JSON.stringify(optionsMelangees).replace(/"/g, '&quot;')})">
                    <div class="lettre-bulle">${['A', 'B', 'C'][idx]}</div>
                    <span class="leading-relaxed">${opt.texte}</span>
                </button>
            `).join("");

            zone.innerHTML = `
                <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden animate-slide-up">
                    <div class="bg-slate-50 border-b border-slate-100 px-6 py-4">
                        <div class="text-xs font-bold tracking-widest uppercase text-brand mb-2 flex items-center gap-2">
                            ${iconSvg} ${data.titre}
                        </div>
                        <p class="text-slate-700 italic leading-relaxed text-[15px] border-l-2 border-slate-300 pl-3">
                            ${data.contexte}
                        </p>
                    </div>
                    
                    <div class="p-6 md:p-8">
                        <h3 class="text-lg font-bold text-slate-800 mb-5">${data.consigne}</h3>
                        <div class="flex flex-col gap-3">
                            ${optsHTML}
                        </div>
                        
                        <div class="mt-6 rounded-xl p-5 text-sm md:text-base leading-relaxed hidden animate-fade-in" id="feedback-box"></div>
                        
                        <button class="hidden w-full bg-brand hover:bg-brand-hover text-white font-bold py-4 rounded-xl transition-all active:scale-[0.98] shadow-md shadow-brand/20 items-center justify-center gap-2 mt-6" id="btn-suivant" onclick="etapeSuivante()">
                            ${currentIndex < CASES.length - 1 ? "Passer au cas suivant" : "Voir le bilan final"}
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </button>
                    </div>
                </div>
            `;
        }

        function validerChoix(idxClique, estJuste, optionsMelangees) {
            if (estJuste) {
                sfx.playSuccess();
                totalScore++;
            } else {
                sfx.playError();
            }

            const data = CASES[currentIndex];
            if (estJuste) totalScore++;

            optionsMelangees.forEach((opt, idx) => {
                const btn = document.getElementById(`opt-${idx}`);
                btn.disabled = true;
                if (idx === idxClique) {
                    btn.className = estJuste ? "btn-choix juste" : "btn-choix faux";
                } else if (opt.bonne && !estJuste) {
                    btn.className = "btn-choix juste"; // Reveal correct answer
                } else {
                    btn.className = "btn-choix neutre-apres";
                }
            });

            const fb = document.getElementById("feedback-box");
            fb.className = estJuste 
                ? "mt-6 rounded-xl p-5 text-[15px] leading-relaxed block animate-fade-in bg-success-bg border border-success-border text-success-text"
                : "mt-6 rounded-xl p-5 text-[15px] leading-relaxed block animate-fade-in bg-error-bg border border-error-border text-error-text";
            
            const iconHtml = estJuste 
                ? `<svg class="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Analyse correcte`
                : `<svg class="w-5 h-5 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg> Pas tout à fait`;

            fb.innerHTML = `<div class="font-bold mb-2 flex items-center ${estJuste ? 'text-success' : 'text-error'}">${iconHtml}</div>${estJuste ? data.fbJuste : data.fbFaux}`;

            const btnSuiv = document.getElementById("btn-suivant");
            btnSuiv.classList.remove("hidden");
            btnSuiv.classList.add("flex");

            // Scroll fluide vers le bouton suivant
            setTimeout(() => {
                btnSuiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        function etapeSuivante() {
            sfx.playClick();
            
            currentIndex++;
            if (currentIndex < CASES.length) {
                afficherEtape();
            } else {
                afficherBilan();
            }
            
            setTimeout(() => {
                document.getElementById("progression-container").scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 50);
        }

        function afficherBilan() {
            document.getElementById("zone-dynamique").innerHTML = "";
            document.getElementById("progression-container").style.display = "none";

            const msgScore = totalScore === 5 
                ? "Excellent ! Vous maîtrisez parfaitement les règles d'or." 
                : "Bonne compréhension globale. Gardez bien en tête les principes factuels de l'observation.";

            const html = `
                <div class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden animate-slide-up w-full">
                    <div class="bg-brand p-8 text-white text-center relative overflow-hidden">
                        <div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
                        <div class="relative z-10">
                            <svg class="w-12 h-12 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <h2 class="text-2xl font-bold mb-2">Bilan de l'activité</h2>
                            <div class="flex items-baseline justify-center gap-1 mb-4">
                                <span class="text-5xl font-black text-brand-light">${totalScore}</span>
                                <span class="text-xl text-white/60 font-medium">/ 5</span>
                            </div>
                            <p class="text-white/80 max-w-lg mx-auto text-sm leading-relaxed">${msgScore}</p>
                        </div>
                    </div>
                    
                    <div class="p-8">
                        <div class="bg-slate-50 border-l-4 border-brand rounded-r-xl p-6 mb-8 text-slate-700 leading-relaxed shadow-sm">
                            L'observation commerciale est un exercice exigeant qui demande de <strong class="text-brand">suspendre son jugement</strong> pour récolter des données neutres et factuelles.
                        </div>
                        
                        <h3 class="text-xs font-bold tracking-widest uppercase text-slate-400 mb-5 text-center">Les règles d'or à retenir</h3>
                        
                        <ul class="space-y-3 mb-8">
                            <li class="flex gap-3 text-slate-700 bg-white p-3 rounded-lg border border-slate-100 shadow-sm"><svg class="w-5 h-5 text-brand flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> <span>Observer des <strong>faits</strong>, jamais des opinions ou ressentis.</span></li>
                            <li class="flex gap-3 text-slate-700 bg-white p-3 rounded-lg border border-slate-100 shadow-sm"><svg class="w-5 h-5 text-brand flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> <span>Prendre des <strong>notes en temps réel</strong>, verbatim si possible.</span></li>
                            <li class="flex gap-3 text-slate-700 bg-white p-3 rounded-lg border border-slate-100 shadow-sm"><svg class="w-5 h-5 text-brand flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> <span><strong>Séparer l'observation de l'évaluation</strong> (l'évaluation se fait après).</span></li>
                            <li class="flex gap-3 text-slate-700 bg-white p-3 rounded-lg border border-slate-100 shadow-sm"><svg class="w-5 h-5 text-brand flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> <span>Ne <strong>jamais intervenir</strong> (sauf risque majeur pour l'entreprise).</span></li>
                        </ul>
                        
                        <button class="w-full bg-white border-2 border-brand text-brand hover:bg-brand hover:text-white font-bold py-4 rounded-xl transition-all shadow-sm flex items-center justify-center gap-2 group" onclick="recommencer()">
                            <svg class="w-5 h-5 group-hover:-rotate-180 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            Recommencer l'activité
                        </button>
                    </div>
                </div>
            `;
            document.getElementById("zone-dynamique").innerHTML = html;
        }

        function recommencer() {
            sfx.playClick();
            
            currentIndex = 0;
            totalScore = 0;
            document.getElementById("progression-container").style.display = "flex";
            initUI();
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        const btnFs = document.getElementById('btn-fullscreen');
        const iconEnter = document.getElementById('icon-fs-enter');
        const iconExit = document.getElementById('icon-fs-exit');
        const spotlight = document.getElementById('spotlight-overlay');

        let isPseudoFs = false;

        function toggleFullScreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !isPseudoFs) {
                const elem = document.documentElement;
                const enterFn = elem.requestFullscreen || elem.webkitRequestFullscreen || elem.mozRequestFullScreen || elem.msRequestFullscreen;

                if (enterFn) {
                    try {
                        const promise = enterFn.call(elem);
                        if (promise && typeof promise.catch === 'function') {
                            promise.catch(err => {
                                console.warn("Plein écran natif bloqué par l'hôte. Activation du pseudo-plein écran.");
                                enablePseudoFs();
                            });
                        }
                    } catch (err) { enablePseudoFs(); }

                    // Fallback silencieux (Safari/Genially) à 300ms
                    setTimeout(() => {
                        if (!document.fullscreenElement && !document.webkitFullscreenElement && !isPseudoFs) {
                            enablePseudoFs();
                        }
                    }, 300);
                } else {
                    enablePseudoFs();
                }
            } else {
                if (isPseudoFs) {
                    disablePseudoFs();
                } else {
                    const exitFn = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
                    if (exitFn) {
                        try { exitFn.call(document); } catch (err) { disablePseudoFs(); }
                    } else { disablePseudoFs(); }
                }
            }
        }

        function enablePseudoFs() {
            isPseudoFs = true; document.body.classList.add('pseudo-fullscreen'); updateFsIcons();
        }
        function disablePseudoFs() {
            isPseudoFs = false; document.body.classList.remove('pseudo-fullscreen'); updateFsIcons();
        }
        function updateFsIcons() {
            if (document.fullscreenElement || document.webkitFullscreenElement || isPseudoFs) {
                iconEnter.classList.add('hidden'); iconExit.classList.remove('hidden');
            } else {
                iconEnter.classList.remove('hidden'); iconExit.classList.add('hidden');
            }
        }

        btnFs.addEventListener('click', (e) => {
            e.stopPropagation(); 
            sfx.playClick();
            toggleFullScreen();
            hideSpotlight();
        });

        const handleFsChange = () => updateFsIcons();
        document.addEventListener('fullscreenchange', handleFsChange);
        document.addEventListener('webkitfullscreenchange', handleFsChange);

        function hideSpotlight() {
            if(spotlight && !spotlight.classList.contains('opacity-0')) {
                spotlight.classList.add('opacity-0');
                setTimeout(() => spotlight.style.display = 'none', 1000);
            }
        }

        document.addEventListener('click', () => hideSpotlight(), { once: true });

        // Demarrage
        initUI();
    </script>
</body>
</html>
