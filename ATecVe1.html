<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Méthodes d'appel : CROC et CERC</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            DEFAULT: '#000099', // Bleu royal principal
                            light: '#e6e6ff',
                            hover: '#0000cc',
                            muted: '#3333b3'
                        },
                        accent: {
                            DEFAULT: '#810464', // Magenta secondaire
                            light: '#fdf2f8',
                        },
                        success: {
                            DEFAULT: '#10b981',
                            bg: '#ecfdf5',
                            text: '#065f46',
                            border: '#6ee7b7'
                        },
                        error: {
                            DEFAULT: '#ef4444',
                            bg: '#fef2f2',
                            text: '#991b1b',
                            border: '#fca5a5'
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out forwards',
                        'slide-up': 'slideUp 0.4s ease-out forwards',
                        'pop-in': 'popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                        'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(15px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        popIn: {
                            '0%': { opacity: '0', transform: 'scale(0.9)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        },
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
                        },
                        swapAnim: {
                            '0%': { transform: 'scale(1)' },
                            '50%': { transform: 'scale(1.02)', backgroundColor: '#e6e6ff' },
                            '100%': { transform: 'scale(1)' }
                        }
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer components {
            .anim-swap {
                animation: swapAnim 0.3s ease-out;
            }
            .btn-choix {
                @apply flex flex-col items-center justify-center gap-3 p-5 border-2 border-slate-200 rounded-2xl bg-slate-50 cursor-pointer transition-all duration-300 text-center w-full relative overflow-hidden;
            }
            .btn-choix:hover:not(:disabled) {
                @apply border-brand bg-brand-light/30 transform -translate-y-1 shadow-[0_8px_20px_rgba(0,0,153,0.08)];
            }
            .btn-choix:disabled {
                @apply cursor-default;
            }
            .btn-choix.juste {
                @apply border-success bg-success-bg ring-2 ring-success/20 transform-none shadow-none;
            }
            .btn-choix.faux {
                @apply border-error bg-error-bg opacity-75 transform-none shadow-none;
            }
            .btn-choix.neutre-apres {
                @apply opacity-40 grayscale-[50%] bg-slate-100 border-slate-200;
            }

            .block-replica {
                @apply p-4 bg-white border-2 border-slate-200 rounded-xl cursor-grab transition-all duration-200 shadow-sm flex items-start gap-3 select-none outline-none focus-visible:ring-2 focus-visible:ring-brand;
            }
            .block-replica:active {
                @apply cursor-grabbing;
            }
            .block-replica:hover {
                @apply border-brand bg-brand-light/20 transform -translate-y-0.5 shadow-md;
            }
            .block-replica.selected {
                @apply bg-slate-50 border-dashed border-slate-300 opacity-50 cursor-default transform-none shadow-none;
            }
            
            .slot-target {
                @apply p-4 border-2 border-dashed border-slate-300 rounded-xl min-h-[76px] flex items-center justify-start gap-3 transition-all duration-300 bg-slate-50 relative overflow-hidden outline-none focus-visible:ring-2 focus-visible:ring-brand;
            }
            .slot-target.filled {
                @apply border-solid border-brand bg-brand-light/10 shadow-sm cursor-pointer;
            }
            .slot-target.filled:hover {
                @apply border-error bg-error-bg/50; /* Indique qu'on peut cliquer pour l'enlever */
            }
            .slot-target.success {
                @apply border-solid border-success bg-success-bg cursor-default pointer-events-none;
            }
            .slot-target.error {
                @apply border-solid border-error bg-error-bg animate-shake;
            }

            .badge-letter {
                @apply w-8 h-8 rounded-lg bg-brand text-white font-bold flex items-center justify-center flex-shrink-0 text-sm shadow-sm;
            }
            .badge-letter.success {
                @apply bg-success;
            }

            .input-acronyme {
                @apply w-full p-3 border-2 border-slate-200 rounded-xl bg-slate-50 text-slate-800 font-medium focus:border-brand focus:ring-2 focus:ring-brand/20 outline-none transition-all;
            }
            .input-acronyme.success {
                @apply border-success bg-success-bg text-success-text pointer-events-none;
            }
            .input-acronyme.error {
                @apply border-error bg-error-bg text-error-text animate-shake;
            }
        }

        body {
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 font-sans p-4 md:p-8 flex flex-col items-center">

    <!-- Bouton Plein Écran -->
    <button id="btn-fullscreen" class="fixed top-4 right-4 z-50 bg-white p-3 rounded-full shadow-lg border border-slate-200 text-brand hover:bg-brand hover:text-white transition-all group" title="Plein écran">
        <svg id="icon-fs-enter" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>

    <!-- Overlay Spotlight -->
    <div id="spotlight-overlay" class="fixed inset-0 z-40 transition-opacity duration-1000 pointer-events-none flex items-start justify-end" style="background: radial-gradient(circle at calc(100% - 2.5rem) 2.5rem, transparent 32px, rgba(15, 23, 42, 0.75) 50px);">
        <div class="mr-[4.5rem] mt-[4.5rem] text-white font-medium text-sm flex items-center gap-3 animate-pulse bg-brand/90 py-2 px-4 rounded-xl backdrop-blur-sm border border-white/20 shadow-2xl">
            <span>Pour un meilleur confort, activez le plein écran</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M7 17L17 7"/><path d="M7 7h10v10"/></svg>
        </div>
    </div>

    <main class="w-full max-w-4xl flex flex-col gap-6 animate-fade-in mt-14 md:mt-0">
        
        <!-- BANDEAU EN-TÊTE -->
        <header class="bg-brand text-white rounded-3xl p-6 md:p-8 shadow-xl shadow-brand/10 flex flex-col md:flex-row items-start md:items-center gap-5 relative overflow-hidden">
            <div class="absolute -top-12 -right-12 w-40 h-40 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="w-14 h-14 min-w-[56px] bg-white text-brand rounded-2xl flex items-center justify-center shadow-sm z-10">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-7 h-7"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </div>
            <div class="z-10">
                <div class="text-brand-light text-xs font-bold tracking-widest uppercase mb-1">Vente Multicanal • Téléphone</div>
                <h1 class="text-2xl md:text-3xl font-extrabold leading-tight mb-2">Les méthodes CROC et CERC</h1>
                <div class="text-white/80 text-sm font-medium">Activité interactive • Structurez vos appels</div>
            </div>
        </header>

        <!-- BARRE DE PROGRESSION -->
        <div class="w-full flex flex-col gap-3" id="progression-wrap" style="display: none;">
            <div class="flex justify-between items-end text-sm">
                <span class="font-semibold text-slate-500 uppercase tracking-wider text-xs" id="progression-label">Appel 1 sur 2</span>
                <span class="font-bold text-brand bg-brand-light px-3 py-1 rounded-full text-xs" id="progression-score">Étape 1 / 2</span>
            </div>
            <div class="h-2.5 bg-slate-200 rounded-full overflow-hidden shadow-inner">
                <div class="h-full bg-brand rounded-full transition-all duration-500 ease-out relative" id="barre-fill" style="width:0%">
                    <div class="absolute inset-0 bg-white/20 w-full h-full animate-pulse"></div>
                </div>
            </div>
        </div>

        <!-- ZONE DYNAMIQUE -->
        <div id="zone-activite" class="w-full flex flex-col gap-6"></div>
        
        <!-- DEBRIEF FINAL -->
        <div id="debrief" class="hidden"></div>
        
    </main>

    <script>
        const SCENARIOS = [
            {
                id: 1,
                type: "CROC",
                introQuote: "« Bonjour, Benito, responsable commercial de ZATI Construction. Je me permets de vous contacter au sujet de notre nouveau catalogue. »",
                initiateur: "Vendeur",
                optionsStep1: [
                    { 
                        id: "CROC",
                        label: "Appel Sortant (Le vendeur appelle)", 
                        methodName: "Méthode CROC",
                        icon: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/><path d="M14.05 2a9 9 0 0 1 8 7.94"/><path d="M14.05 6A5 5 0 0 1 18 10"/></svg>`,
                        correct: true 
                    },
                    { 
                        id: "CERC",
                        label: "Appel Entrant (Le client appelle)", 
                        methodName: "Méthode CERC",
                        icon: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/><path d="m14 10 6-6"/><path d="M15 4h5v5"/></svg>`,
                        correct: false 
                    }
                ],
                feedbackStep1: "Exact ! C'est le vendeur qui initie l'appel. Il doit utiliser la méthode CROC pour structurer son discours et être convaincant dès les premières secondes.",
                steps: [
                    { letter: "C", name: "Contact", text: "Bonjour monsieur, ici Benito, responsable commercial de ZATI Construction." },
                    { letter: "R", name: "Raison de l'appel", text: "Je vous contacte aujourd'hui pour vous présenter notre nouveau catalogue de matériaux." },
                    { letter: "O", name: "Objectif", text: "Pouvons-nous convenir d'un rendez-vous téléphonique la semaine prochaine pour en discuter ?" },
                    { letter: "C", name: "Conclusion", text: "Parfait, je bloque le créneau de mardi 10h. Je vous remercie et vous souhaite une excellente journée." }
                ]
            },
            {
                id: 2,
                type: "CERC",
                introQuote: "« Bonjour, j'ai reçu ma commande ce matin, mais il manque une pièce de fixation à l'intérieur. »",
                initiateur: "Client",
                optionsStep1: [
                    { id: "CROC", label: "Appel Sortant (Le vendeur appelle)", methodName: "Méthode CROC", icon: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/><path d="M14.05 2a9 9 0 0 1 8 7.94"/><path d="M14.05 6A5 5 0 0 1 18 10"/></svg>`, correct: false },
                    { id: "CERC", label: "Appel Entrant (Le client appelle)", methodName: "Méthode CERC", icon: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/><path d="m14 10 6-6"/><path d="M15 4h5v5"/></svg>`, correct: true }
                ],
                feedbackStep1: "Bien vu ! C'est le client qui appelle suite à un problème. Le conseiller doit utiliser la méthode CERC pour écouter et résoudre la situation efficacement.",
                steps: [
                    { letter: "C", name: "Contact", text: "Service Client ZATI Construction, Marc à votre écoute, bonjour." },
                    { letter: "E", name: "Écoute", text: "Si je comprends bien, il manque une pièce de fixation dans la commande que vous avez reçue ce matin ?" },
                    { letter: "R", name: "Réponse", text: "Après vérification, la pièce est dans un second colis qui est actuellement en cours de livraison pour cet après-midi." },
                    { letter: "C", name: "Conclusion", text: "Est-ce que cette information vous rassure ? Je vous remercie de votre appel et vous souhaite une bonne journée." }
                ]
            }
        ];

        const DEFINITIONS = [
            { id: "CROC", text: "Structure d'appel sortant pour capter l'attention et atteindre un objectif défini." },
            { id: "CERC", text: "Structure d'appel entrant pour comprendre une demande et y apporter une solution." },
            { id: "DIST1", text: "Technique de traitement des objections basée sur la reformulation et l'anticipation." },
            { id: "DIST2", text: "Méthode d'argumentation visant à démontrer techniquement un produit ou service." }
        ];

        let currentIndex = 0;
        let currentIntroMethod = 'CROC';
        let currentErrors = 0;
        
        let shuffledReplicas = [];
        let selectedOrder = [null, null, null, null];
        let orderValidated = false;
        let selectedReplicaIndex = null;

        let shuffledDefs = [];
        let selectedDefs = { "CROC": null, "CERC": null };
        let selectedDefIndex = null;
        let defsValidated = false;

        let audioInitialized = false;
        let synth, polySynth, membrane, vol;

        async function initAudio() {
            if (audioInitialized) return;
            await Tone.start();
            
            vol = new Tone.Volume(-15).toDestination();

            synth = new Tone.Synth({
                oscillator: { type: "sine" },
                envelope: { attack: 0.1, decay: 0.2, sustain: 0, release: 0.2 }
            }).connect(vol);
            
            polySynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "triangle" },
                envelope: { attack: 0.05, decay: 0.2, sustain: 0.2, release: 1 }
            }).connect(vol);
            
            membrane = new Tone.MembraneSynth({
                pitchDecay: 0.01,
                octaves: 1,
                oscillator: { type: "sine" },
                envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.01 }
            }).connect(vol);
            
            audioInitialized = true;
        }

        function playClick() {
            if (!audioInitialized) initAudio();
            if (membrane) membrane.triggerAttackRelease("C5", "32n", Tone.now(), 0.1);
        }

        function playSuccess() {
            if (!audioInitialized) initAudio();
            if (polySynth) polySynth.triggerAttackRelease(["C4", "E4", "G4", "C5"], "8n", Tone.now(), 0.2);
        }

        function playError() {
            if (!audioInitialized) initAudio();
            if (synth) synth.triggerAttackRelease("C2", "8n", Tone.now(), 0.3);
        }

        function shuffleArray(array) {
            const newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        function renderStep0() {
            currentErrors = 0;
            const zone = document.getElementById("zone-activite");
            document.getElementById("progression-wrap").style.display = "none";

            const isCroc = currentIntroMethod === 'CROC';
            const methodColor = isCroc ? "text-accent" : "text-brand";
            const bgBadge = isCroc ? "bg-accent" : "bg-brand";
            const titleText = isCroc ? "Méthode CROC (Appel sortant)" : "Méthode CERC (Appel entrant)";
            const letters = isCroc ? ['C', 'R', 'O', 'C'] : ['C', 'E', 'R', 'C'];
            const prefix = isCroc ? 'croc' : 'cerc';

            zone.innerHTML = `
                <div class="bg-white rounded-3xl shadow-lg border border-slate-100 overflow-hidden animate-slide-up" onclick="initAudio()">
                    <div class="bg-slate-50 border-b border-slate-100 px-6 py-4 flex justify-between items-center">
                        <span class="text-xs font-bold tracking-widest uppercase text-slate-400">Défi d'ouverture - Étape ${isCroc ? '1/2' : '2/2'}</span>
                    </div>
                    
                    <div class="p-6 md:p-8">
                        <h2 class="text-xl md:text-2xl font-bold text-slate-800 mb-4 text-center">Que signifie l'acronyme ${currentIntroMethod} ?</h2>
                        <p class="text-sm text-slate-600 text-center mb-8">Complétez les mots ci-dessous pour prouver que vous connaissez cette structure.</p>
                        
                        <div class="flex flex-col gap-4 max-w-sm mx-auto">
                            <h3 class="font-bold ${methodColor} mb-2 flex items-center gap-2 justify-center">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${isCroc ? 'M14.05 2a9 9 0 0 1 8 7.94M14.05 6A5 5 0 0 1 18 10M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z' : 'M15 4h5v5M14 10l6-6M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z'}"></path>
                                </svg> 
                                ${titleText}
                            </h3>
                            ${letters.map((lettre, i) => `
                                <div class="flex items-center gap-3">
                                    <div class="badge-letter ${bgBadge}">${lettre}</div>
                                    <input type="text" id="${prefix}-${i}" class="input-acronyme" placeholder="...">
                                </div>
                            `).join('')}
                        </div>
                        
                        <div id="feedback-step0" class="hidden mt-6 rounded-xl p-5 text-sm leading-relaxed text-center font-medium"></div>

                        <button id="btn-validate-step0" onclick="validerAcronymes()" class="mt-8 w-full md:w-auto md:mx-auto md:px-12 md:flex bg-brand hover:bg-brand-hover text-white font-bold py-4 rounded-xl transition-all shadow-md shadow-brand/20 items-center justify-center gap-2">
                            Valider ${currentIntroMethod}
                        </button>
                    </div>
                </div>
            `;
            
            document.addEventListener('keydown', initAudio, {once: true});
        }

        function validerAcronymes() {
            playClick();
            const normalize = (str) => str.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[''-]/g, " ");
            
            const expectedCroc = [['contact'], ['raison', 'raison de l appel', 'raison appel'], ['objectif'], ['conclusion']];
            const expectedCerc = [['contact'], ['ecoute'], ['reponse'], ['conclusion']];

            let allValid = true;
            let expected = currentIntroMethod === 'CROC' ? expectedCroc : expectedCerc;
            let prefix = currentIntroMethod === 'CROC' ? 'croc' : 'cerc';

            for(let i=0; i<4; i++) {
                const input = document.getElementById(`${prefix}-${i}`);
                const val = normalize(input.value);
                if (expected[i].some(ans => val.includes(ans) && val.length > 0)) {
                    input.classList.remove("error"); input.classList.add("success");
                } else {
                    input.classList.remove("success"); input.classList.add("error");
                    allValid = false;
                }
            }

            const feedback = document.getElementById("feedback-step0");
            const btn = document.getElementById("btn-validate-step0");

            if (allValid) {
                currentErrors = 0;
                playSuccess();
                feedback.className = "mt-6 max-w-sm mx-auto rounded-xl p-5 text-sm leading-relaxed block animate-fade-in bg-success-bg border border-success-border text-success-text text-center font-bold";
                
                if (currentIntroMethod === 'CROC') {
                    feedback.innerHTML = "Parfait ! La méthode CROC n'a plus de secrets pour vous. Passons à CERC.";
                    btn.innerHTML = 'Suivant : La méthode CERC <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>';
                    btn.onclick = () => {
                        playClick();
                        currentIntroMethod = 'CERC';
                        renderStep0();
                    };
                } else {
                    feedback.innerHTML = "Excellent ! Vous connaissez vos fondamentaux.";
                    btn.innerHTML = 'Commencer les mises en situation <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>';
                    btn.onclick = () => {
                        playClick();
                        document.getElementById("progression-wrap").style.display = "flex";
                        renderStep1();
                    };
                }
                
                btn.classList.add("animate-pulse");
            } else {
                currentErrors++;
                playError();
                feedback.className = "mt-6 max-w-sm mx-auto rounded-xl p-5 text-sm leading-relaxed block animate-fade-in bg-error-bg border border-error-border text-error-text text-center font-medium";
                
                let errorMsg = "Certains termes sont incorrects ou manquants. Corrigez-les.";
                
                if (currentErrors === 2) {
                    errorMsg += `<br><br><button onclick="afficherIndice()" class="text-error font-bold hover:underline flex justify-center items-center gap-1 mx-auto"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Voir un indice</button>`;
                } else if (currentErrors >= 3) {
                    errorMsg += `<br><br><button onclick="donnerSolution()" class="text-error font-bold hover:underline flex justify-center items-center gap-1 mx-auto"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Remplir avec la solution</button>`;
                }
                
                feedback.innerHTML = errorMsg;
                
                setTimeout(() => {
                    document.querySelectorAll('.input-acronyme.error').forEach(el => el.classList.remove("error"));
                }, 1500);
            }
        }

        function afficherIndice() {
            playClick();
            const feedback = document.getElementById("feedback-step0");
            const hintText = currentIntroMethod === 'CROC' 
                ? "<strong>C</strong>ontact (Salutations)<br><strong>R</strong>aison (Le but de l'appel)<br><strong>O</strong>bjectif (Ce qu'on veut obtenir)<br><strong>C</strong>onclusion (Prise de congé)" 
                : "<strong>C</strong>ontact (Accueil)<br><strong>É</strong>coute (Comprendre la demande)<br><strong>R</strong>éponse (La solution)<br><strong>C</strong>onclusion (Prise de congé)";
            feedback.innerHTML = `<div class="font-bold mb-2 flex items-center justify-center gap-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Indice</div><div class="text-left inline-block">${hintText}</div>`;
        }

        function donnerSolution() {
            const display = currentIntroMethod === 'CROC' 
                ? ['Contact', 'Raison', 'Objectif', 'Conclusion'] 
                : ['Contact', 'Écoute', 'Réponse', 'Conclusion'];
            const prefix = currentIntroMethod === 'CROC' ? 'croc' : 'cerc';

            for(let i=0; i<4; i++) {
                document.getElementById(`${prefix}-${i}`).value = display[i];
            }
            validerAcronymes();
        }

        function renderStep1() {
            const scenario = SCENARIOS[currentIndex];
            const zone = document.getElementById("zone-activite");
            
            // Calcul de la progression : 5 écrans au total (S1_1, S1_2, S2_1, S2_2, Synthèse)
            // Donc S1_1 = 20%, S1_2 = 40%, S2_1 = 60%, S2_2 = 80%
            document.getElementById("progression-label").textContent = `Appel ${currentIndex + 1} sur 2`;
            document.getElementById("progression-score").textContent = "Identification";
            document.getElementById("barre-fill").style.width = ((currentIndex * 2) + 1) * 20 + "%";

            zone.innerHTML = `
                <div class="bg-white rounded-3xl shadow-lg border border-slate-100 overflow-hidden animate-slide-up">
                    <div class="bg-slate-50 border-b border-slate-100 px-6 py-4 flex justify-between items-center">
                        <span class="text-xs font-bold tracking-widest uppercase text-slate-400">Étape 1 : Identification</span>
                    </div>
                    
                    <div class="p-6 md:p-8">
                        <div class="text-xs font-bold tracking-widest uppercase text-brand mb-3 flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            Ouverture de l'appel
                        </div>
                        
                        <p class="text-lg md:text-xl text-slate-800 font-medium italic leading-relaxed border-l-4 border-brand/40 pl-5 mb-8 py-2">
                            ${scenario.introQuote}
                        </p>
                        
                        <h3 class="text-sm font-bold text-slate-700 mb-4 text-center">Qui est à l'origine de cet appel et quelle méthode appliquer ?</h3>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${scenario.optionsStep1.map((opt, i) => `
                                <button class="btn-choix group" id="btn-opt-${i}" onclick="validerStep1(${i})">
                                    <div class="text-brand group-hover:scale-110 transition-transform duration-300">
                                        ${opt.icon}
                                    </div>
                                    <div class="flex flex-col items-center gap-1">
                                        <span class="font-bold text-slate-700">${opt.label}</span>
                                        <span class="text-xs font-bold uppercase tracking-wider px-3 py-1 bg-slate-200 text-slate-600 rounded-full group-hover:bg-brand group-hover:text-white transition-colors">${opt.methodName}</span>
                                    </div>
                                </button>
                            `).join('')}
                        </div>
                        
                        <div id="feedback-step1" class="hidden mt-6 rounded-xl p-5 text-sm leading-relaxed animate-fade-in"></div>
                        
                        <button id="btn-to-step2" onclick="initStep2()" class="hidden mt-6 w-full bg-brand hover:bg-brand-hover text-white font-bold py-4 rounded-xl transition-all shadow-md shadow-brand/20 items-center justify-center gap-2">
                            Passer à l'étape 2 : Reconstituer l'appel
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </button>
                    </div>
                </div>
            `;
        }

        function validerStep1(selectedIndex) {
            playClick();
            const scenario = SCENARIOS[currentIndex];
            const isCorrect = scenario.optionsStep1[selectedIndex].correct;
            
            scenario.optionsStep1.forEach((_, i) => {
                document.getElementById(`btn-opt-${i}`).disabled = true;
            });

            const btnSelected = document.getElementById(`btn-opt-${selectedIndex}`);
            const feedback = document.getElementById("feedback-step1");
            const btnNext = document.getElementById("btn-to-step2");

            if (isCorrect) {
                playSuccess();
                btnSelected.classList.add("juste");
                const otherIndex = selectedIndex === 0 ? 1 : 0;
                document.getElementById(`btn-opt-${otherIndex}`).classList.add("neutre-apres");

                feedback.className = "mt-6 rounded-xl p-5 text-sm leading-relaxed block animate-fade-in bg-success-bg border border-success-border text-success-text";
                feedback.innerHTML = `<div class="font-bold text-success mb-1 flex items-center gap-2"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Correct !</div>${scenario.feedbackStep1}`;
                
                btnNext.classList.remove("hidden");
                btnNext.classList.add("flex");
            } else {
                playError();
                btnSelected.classList.add("faux");
                setTimeout(() => {
                    btnSelected.classList.remove("faux");
                    scenario.optionsStep1.forEach((_, i) => {
                        document.getElementById(`btn-opt-${i}`).disabled = false;
                    });
                }, 1000);
            }
        }

        function initStep2() {
            const scenario = SCENARIOS[currentIndex];
            document.getElementById("progression-score").textContent = "Reconstitution";
            document.getElementById("barre-fill").style.width = ((currentIndex * 2) + 2) * 20 + "%";

            const stepsWithOriginalIndex = scenario.steps.map((s, idx) => ({ ...s, originalIndex: idx }));
            shuffledReplicas = shuffleArray(stepsWithOriginalIndex);
            selectedOrder = [null, null, null, null];
            orderValidated = false;
            selectedReplicaIndex = null;
            
            const zone = document.getElementById("zone-activite");
            const methodTag = scenario.type === "CROC" ? "bg-accent text-white" : "bg-brand text-white";

            zone.innerHTML = `
                <div class="bg-white rounded-3xl shadow-lg border border-slate-100 overflow-hidden animate-slide-up">
                    <div class="bg-slate-50 border-b border-slate-100 px-6 py-4 flex justify-between items-center flex-wrap gap-2">
                        <span class="text-xs font-bold tracking-widest uppercase text-slate-400">Étape 2 : L'appel complet</span>
                        <span class="text-xs font-bold tracking-widest uppercase px-3 py-1 rounded-full ${methodTag}">Méthode ${scenario.type}</span>
                    </div>
                    
                    <div class="p-6 md:p-8">
                        <p class="text-sm text-slate-600 mb-6 font-medium">Reconstituez les 4 étapes de cet appel selon la structure de la méthode <strong class="${scenario.type === 'CROC' ? 'text-accent' : 'text-brand'}">${scenario.type}</strong>. <strong>Cliquez sur une réplique puis sur l'emplacement cible</strong> (ou glissez-les).</p>
                        
                        <div class="flex flex-col md:flex-row gap-8">
                            <div class="flex-1 flex flex-col gap-3">
                                <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Votre ordre</h4>
                                <div id="slots-container" class="flex flex-col gap-3"></div>
                            </div>
                            
                            <div class="flex-1 flex flex-col gap-3 pt-6 md:pt-0 md:border-l md:border-slate-100 md:pl-8 relative">
                                <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Répliques mélangées</h4>
                                <div id="replicas-container" class="flex flex-col gap-3 relative min-h-[300px]"></div>
                            </div>
                        </div>
                        
                        <div id="validation-area" class="mt-8 flex flex-col items-center min-h-[50px]"></div>
                    </div>
                </div>
            `;
            renderStep2UI();
        }

        function renderStep2UI() {
            const slotsContainer = document.getElementById("slots-container");
            const replicasContainer = document.getElementById("replicas-container");
            const validationArea = document.getElementById("validation-area");
            if (!slotsContainer || !replicasContainer) return;

            let slotsHTML = "";
            for (let i = 0; i < 4; i++) {
                const item = selectedOrder[i];
                const isReadyToReceive = selectedReplicaIndex !== null && !item;
                
                if (item) {
                    slotsHTML += `
                        <div class="slot-target filled group ${selectedReplicaIndex !== null ? 'hover:border-brand cursor-pointer' : ''}" 
                             draggable="true"
                             ondragstart="handleSlotDragStart(event, ${i})"
                             ondragover="handleDragOver(event)" 
                             ondragleave="handleDragLeave(event)" 
                             ondrop="handleDrop(event, ${i})" 
                             onclick="handleSlotClick(${i})" 
                             onkeydown="handleSlotKeyDown(event, ${i})" 
                             tabindex="0">
                            <div class="w-6 h-6 rounded-full bg-brand text-white flex items-center justify-center text-xs font-bold flex-shrink-0 cursor-grab">${i + 1}</div>
                            <div class="text-sm font-medium text-slate-700 leading-snug">${item.text}</div>
                            
                            <div class="absolute inset-0 ${selectedReplicaIndex !== null ? 'bg-brand/90' : 'bg-slate-800/90'} text-white flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity rounded-xl">
                                <span class="text-sm font-bold flex items-center gap-2">
                                    ${selectedReplicaIndex !== null 
                                        ? '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg> Remplacer' 
                                        : '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"></path></svg> Glisser ou Clic pour retirer'}
                                </span>
                            </div>
                        </div>
                    `;
                } else {
                    slotsHTML += `
                        <div class="slot-target ${isReadyToReceive ? 'border-brand bg-brand-light/20 ring-2 ring-brand/30 cursor-pointer scale-[1.02]' : ''}" 
                             style="${isReadyToReceive ? 'transition: all 0.2s;' : ''}"
                             ondragover="handleDragOver(event)" 
                             ondragleave="handleDragLeave(event)" 
                             ondrop="handleDrop(event, ${i})"
                             onclick="handleSlotClick(${i})"
                             onkeydown="handleSlotKeyDown(event, ${i})"
                             tabindex="${isReadyToReceive ? '0' : '-1'}">
                            <div class="w-6 h-6 rounded-full ${isReadyToReceive ? 'bg-brand text-white' : 'bg-slate-200 text-slate-500'} flex items-center justify-center text-xs font-bold flex-shrink-0">${i + 1}</div>
                            <div class="text-sm ${isReadyToReceive ? 'text-brand font-medium' : 'text-slate-400 italic'}">
                                ${isReadyToReceive ? 'Cliquez ici pour placer la réplique' : 'Glissez ou cliquez sur une réplique puis ici'}
                            </div>
                        </div>
                    `;
                }
            }
            slotsContainer.innerHTML = slotsHTML;

            let availableHTML = "";
            shuffledReplicas.forEach((rep, i) => {
                const isPlaced = selectedOrder.find(slotItem => slotItem && slotItem.originalIndex === rep.originalIndex);
                const isCurrentlySelected = selectedReplicaIndex === i;
                
                if (isPlaced) {
                    availableHTML += `
                        <div class="block-replica selected transition-all">
                            <div class="w-6 h-6 flex-shrink-0 flex items-center justify-center text-slate-300"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg></div>
                            <div class="text-sm text-slate-400 line-through">${rep.text}</div>
                        </div>
                    `;
                } else {
                    availableHTML += `
                        <div class="block-replica group transition-all ${isCurrentlySelected ? 'border-brand bg-brand-light/10 ring-2 ring-brand shadow-md transform -translate-y-1' : ''}" 
                             draggable="true" 
                             ondragstart="handleDragStart(event, ${i})" 
                             ondragend="handleDragEnd(event)"
                             onclick="selectReplica(${i})" 
                             onkeydown="handleKeyDown(event, ${i})" 
                             tabindex="0">
                            <div class="w-6 h-6 rounded-full ${isCurrentlySelected ? 'bg-brand text-white' : 'bg-slate-100 text-slate-400 group-hover:bg-brand group-hover:text-white'} flex items-center justify-center flex-shrink-0 transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
                            </div>
                            <div class="text-sm font-medium ${isCurrentlySelected ? 'text-brand' : 'text-slate-700'}">${rep.text}</div>
                        </div>
                    `;
                }
            });
            replicasContainer.innerHTML = availableHTML;

            let valHTML = "";
            if (selectedOrder.every(item => item !== null)) {
                valHTML = `
                    <button onclick="validerOrdre()" class="w-full md:w-auto bg-brand hover:bg-brand-hover text-white font-bold py-3 px-8 rounded-xl transition-all shadow-md shadow-brand/20 flex items-center justify-center gap-2 animate-pop-in">
                        Vérifier mon ordre
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </button>
                `;
            }
            if(validationArea && (!validationArea.innerHTML.includes("bg-error-bg") || selectedOrder.some(item => item === null))) {
                validationArea.innerHTML = valHTML;
            }
        }

        function selectReplica(index) {
            if (orderValidated) return;
            playClick();
            selectedReplicaIndex = selectedReplicaIndex === index ? null : index;
            document.getElementById("validation-area").innerHTML = "";
            renderStep2UI();
        }

        function handleSlotClick(slotIndex) {
            if (orderValidated) return;
            playClick();

            if (selectedReplicaIndex !== null) {
                const rep = shuffledReplicas[selectedReplicaIndex];
                const existingSlotIndex = selectedOrder.findIndex(item => item && item.originalIndex === rep.originalIndex);
                if (existingSlotIndex !== -1) selectedOrder[existingSlotIndex] = null;

                selectedOrder[slotIndex] = rep;
                selectedReplicaIndex = null; 
                animateSlot(slotIndex);
            } else {
                if (selectedOrder[slotIndex] !== null) selectedOrder[slotIndex] = null;
            }
            document.getElementById("validation-area").innerHTML = "";
            renderStep2UI();
        }

        function validerOrdre() {
            playClick();
            let isCorrect = true;
            for (let i = 0; i < 4; i++) {
                if (selectedOrder[i].originalIndex !== i) {
                    isCorrect = false; break;
                }
            }
            const valArea = document.getElementById("validation-area");
            if (isCorrect) {
                playSuccess();
                orderValidated = true;
                renderSuccessUI();
            } else {
                playError();
                valArea.innerHTML = `
                    <div class="bg-error-bg border border-error text-error text-sm font-medium py-3 px-6 rounded-xl flex items-center gap-3 animate-shake w-full md:w-auto justify-center mb-4">
                        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        L'ordre n'est pas correct. Déplacez les étiquettes pour corriger.
                    </div>
                `;
            }
        }

        function animateSlot(slotIndex) {
            setTimeout(() => {
                const slots = document.getElementById("slots-container").children;
                if(slots[slotIndex]) {
                    slots[slotIndex].classList.remove('anim-swap');
                    void slots[slotIndex].offsetWidth; 
                    slots[slotIndex].classList.add('anim-swap');
                }
            }, 10);
        }

        function handleDragStart(e, index) {
            if (orderValidated) return;
            playClick();
            e.dataTransfer.setData("text/plain", "replica:" + index);
            setTimeout(() => { e.target.classList.add('opacity-50'); }, 10);
        }

        function handleSlotDragStart(e, slotIndex) {
            if (orderValidated) return;
            playClick();
            e.dataTransfer.setData("text/plain", "slot:" + slotIndex);
            setTimeout(() => { e.target.classList.add('opacity-50'); }, 10);
        }

        function handleDragEnd(e) { e.target.classList.remove('opacity-50'); }

        function handleDragOver(e) {
            e.preventDefault();
            if (orderValidated) return;
            if (!e.currentTarget.classList.contains('filled')) {
                e.currentTarget.classList.add('border-brand', 'bg-brand-light/20');
            }
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('border-brand', 'bg-brand-light/20');
        }

        function handleDrop(e, slotIndex) {
            e.preventDefault();
            e.currentTarget.classList.remove('border-brand', 'bg-brand-light/20');
            if (orderValidated) return;
            playClick();
            
            const data = e.dataTransfer.getData("text/plain");
            if (!data) return;
            
            if (data.startsWith("replica:")) {
                const repIndex = parseInt(data.split(":")[1]);
                const existingSlotIndex = selectedOrder.findIndex((item, idx) => idx !== slotIndex && item && item.originalIndex === shuffledReplicas[repIndex].originalIndex);
                if (existingSlotIndex !== -1) selectedOrder[existingSlotIndex] = null;
                selectedOrder[slotIndex] = shuffledReplicas[repIndex];
                selectedReplicaIndex = null;
                animateSlot(slotIndex);
            } 
            else if (data.startsWith("slot:")) {
                const sourceSlotIndex = parseInt(data.split(":")[1]);
                if (sourceSlotIndex !== slotIndex) {
                    const temp = selectedOrder[slotIndex];
                    selectedOrder[slotIndex] = selectedOrder[sourceSlotIndex];
                    selectedOrder[sourceSlotIndex] = temp;
                    animateSlot(slotIndex); animateSlot(sourceSlotIndex);
                }
            }
            document.getElementById("validation-area").innerHTML = "";
            renderStep2UI();
        }

        function handleKeyDown(e, replicaIndex) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault(); selectReplica(replicaIndex);
            }
        }

        function handleSlotKeyDown(e, slotIndex) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault(); handleSlotClick(slotIndex);
            }
        }

        function renderSuccessUI() {
            const scenario = SCENARIOS[currentIndex];
            const zone = document.getElementById("zone-activite");
            const methodTag = scenario.type === "CROC" ? "bg-accent text-white" : "bg-brand text-white";

            let slotsHTML = "";
            for (let i = 0; i < 4; i++) {
                const item = scenario.steps[i]; 
                slotsHTML += `
                    <div class="p-4 border-2 border-success bg-success-bg rounded-xl flex flex-col md:flex-row md:items-center justify-start gap-4 animate-slide-up" style="animation-delay: ${i * 100}ms">
                        <div class="flex items-center gap-3 flex-shrink-0 md:w-32">
                            <div class="badge-letter success">${item.letter}</div>
                            <span class="text-xs font-bold uppercase tracking-wider text-success">${item.name}</span>
                        </div>
                        <div class="text-sm font-medium text-slate-800 leading-snug border-l-2 border-success/30 pl-4 py-1">${item.text}</div>
                    </div>
                `;
            }

            zone.innerHTML = `
                <div class="bg-white rounded-3xl shadow-lg border border-success-border overflow-hidden animate-fade-in">
                    <div class="bg-success text-white px-6 py-4 flex justify-between items-center flex-wrap gap-2">
                        <span class="text-sm font-bold flex items-center gap-2"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Ordre parfait !</span>
                        <span class="text-xs font-bold tracking-widest uppercase px-3 py-1 rounded-full bg-white/20">Méthode ${scenario.type} validée</span>
                    </div>
                    <div class="p-6 md:p-8 flex flex-col gap-4">
                        ${slotsHTML}
                        <div class="mt-6 flex justify-center">
                            <button onclick="appelSuivant()" class="w-full md:w-auto bg-brand hover:bg-brand-hover text-white font-bold py-4 px-10 rounded-xl transition-all shadow-md shadow-brand/20 flex items-center justify-center gap-2">
                                ${currentIndex < SCENARIOS.length - 1 ? "Passer à l'appel suivant" : "Dernière étape : Synthèse"}
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function appelSuivant() {
            playClick();
            currentIndex++;
            if (currentIndex < SCENARIOS.length) {
                renderStep1();
            } else {
                renderStep3();
            }
        }

        function renderStep3() {
            document.getElementById("progression-label").textContent = `Synthèse finale`;
            document.getElementById("progression-score").textContent = "Définitions";
            document.getElementById("barre-fill").style.width = "100%";

            const defsWithOrig = DEFINITIONS.map((d, i) => ({ ...d, originalIndex: i }));
            shuffledDefs = shuffleArray(defsWithOrig);
            selectedDefs = { "CROC": null, "CERC": null };
            selectedDefIndex = null;
            defsValidated = false;

            const zone = document.getElementById("zone-activite");
            zone.innerHTML = `
                <div class="bg-white rounded-3xl shadow-lg border border-slate-100 overflow-hidden animate-slide-up">
                    <div class="bg-slate-50 border-b border-slate-100 px-6 py-4 flex justify-between items-center">
                        <span class="text-xs font-bold tracking-widest uppercase text-slate-400">Étape finale : Synthèse</span>
                    </div>
                    
                    <div class="p-6 md:p-8">
                        <p class="text-sm text-slate-600 mb-6 font-medium text-center">Associez la bonne définition à chaque méthode. <strong class="text-brand">Attention, il y a 2 intrus !</strong> Cliquez sur une définition puis sur la méthode correspondante (ou glissez-les).</p>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                            <!-- CROC -->
                            <div class="flex flex-col gap-2">
                                <div class="bg-accent text-white font-bold py-2 px-4 rounded-t-xl text-center">CROC (Appel sortant)</div>
                                <div id="def-slot-CROC" class="slot-target rounded-none rounded-b-xl min-h-[100px] flex items-center justify-center p-4 bg-slate-50 cursor-pointer transition-all"
                                     ondragover="handleDefDragOver(event)" ondragleave="handleDefDragLeave(event)" ondrop="handleDefDrop(event, 'CROC')" onclick="handleDefSlotClick('CROC')">
                                </div>
                            </div>

                            <!-- CERC -->
                            <div class="flex flex-col gap-2">
                                <div class="bg-brand text-white font-bold py-2 px-4 rounded-t-xl text-center">CERC (Appel entrant)</div>
                                <div id="def-slot-CERC" class="slot-target rounded-none rounded-b-xl min-h-[100px] flex items-center justify-center p-4 bg-slate-50 cursor-pointer transition-all"
                                     ondragover="handleDefDragOver(event)" ondragleave="handleDefDragLeave(event)" ondrop="handleDefDrop(event, 'CERC')" onclick="handleDefSlotClick('CERC')">
                                </div>
                            </div>
                        </div>

                        <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 text-center">Définitions mélangées</h4>
                        <div id="defs-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3 relative min-h-[150px]"></div>
                        
                        <div id="validation-def-area" class="mt-8 flex flex-col items-center min-h-[50px]"></div>
                    </div>
                </div>
            `;
            renderStep3UI();
        }

        function renderStep3UI() {
            ['CROC', 'CERC'].forEach(method => {
                const slot = document.getElementById(`def-slot-${method}`);
                if (!slot) return;
                const item = selectedDefs[method];
                const isReadyToReceive = selectedDefIndex !== null && !item;
                const methodColor = method === 'CROC' ? 'accent' : 'brand';
                const methodHex = method === 'CROC' ? '#810464' : '#000099';

                if (item) {
                    slot.className = `border-2 border-solid border-${methodColor} bg-${methodColor}/5 rounded-b-xl min-h-[100px] flex items-center justify-center p-4 cursor-pointer relative group transition-all`;
                    slot.innerHTML = `
                        <div class="text-sm font-medium text-slate-800 text-center leading-relaxed">${item.text}</div>
                        <div class="absolute inset-0 ${selectedDefIndex !== null ? 'bg-'+methodColor+'/90' : 'bg-slate-900/80'} text-white flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity rounded-b-xl">
                            <span class="text-sm font-bold flex items-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg> 
                                ${selectedDefIndex !== null ? 'Remplacer' : 'Retirer'}
                            </span>
                        </div>
                    `;
                } else {
                    slot.className = `border-2 border-dashed ${isReadyToReceive ? 'border-'+methodColor+' bg-'+methodColor+'/10 ring-2 ring-'+methodColor+'/30 scale-[1.02]' : 'border-slate-300 bg-slate-50'} rounded-b-xl min-h-[100px] flex items-center justify-center p-4 cursor-pointer transition-all`;
                    slot.innerHTML = `<span class="${isReadyToReceive ? 'text-'+methodColor+' font-medium' : 'text-slate-400 italic'} text-sm text-center">${isReadyToReceive ? 'Cliquez ici pour placer' : 'Placez la définition correspondante ici'}</span>`;
                }
            });

            const container = document.getElementById('defs-container');
            if (!container) return;
            
            let availHTML = "";
            shuffledDefs.forEach((def, i) => {
                const isPlaced = selectedDefs.CROC?.originalIndex === def.originalIndex || selectedDefs.CERC?.originalIndex === def.originalIndex;
                const isCurrentlySelected = selectedDefIndex === i;

                if (isPlaced) {
                     availHTML += `<div class="p-4 bg-slate-50 border border-slate-200 rounded-xl opacity-50 flex items-center justify-center text-center"><span class="text-sm text-slate-400 line-through">${def.text}</span></div>`;
                } else {
                     availHTML += `
                        <div class="block-replica group transition-all ${isCurrentlySelected ? 'border-brand bg-brand-light/10 ring-2 ring-brand shadow-md transform -translate-y-1' : ''} flex items-center justify-center text-center p-4 min-h-[80px]"
                             draggable="true" ondragstart="handleDefDragStart(event, ${i})" onclick="selectDef(${i})">
                            <span class="text-sm font-medium ${isCurrentlySelected ? 'text-brand' : 'text-slate-700'}">${def.text}</span>
                        </div>
                     `;
                }
            });
            container.innerHTML = availHTML;

            const valArea = document.getElementById("validation-def-area");
            if (!valArea) return;
            if (selectedDefs.CROC !== null && selectedDefs.CERC !== null) {
                valArea.innerHTML = `
                    <button onclick="validerDefs()" class="w-full md:w-auto bg-brand hover:bg-brand-hover text-white font-bold py-3 px-8 rounded-xl transition-all shadow-md flex items-center justify-center gap-2 animate-pop-in">
                        Valider l'association
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </button>
                `;
            } else {
                 valArea.innerHTML = "";
            }
        }

        function selectDef(index) {
            if (defsValidated) return;
            playClick();
            selectedDefIndex = selectedDefIndex === index ? null : index;
            document.getElementById("validation-def-area").innerHTML = "";
            renderStep3UI();
        }

        function handleDefSlotClick(method) {
            if (defsValidated) return;
            playClick();
            if (selectedDefIndex !== null) {
                const def = shuffledDefs[selectedDefIndex];
                if(selectedDefs.CROC?.originalIndex === def.originalIndex) selectedDefs.CROC = null;
                if(selectedDefs.CERC?.originalIndex === def.originalIndex) selectedDefs.CERC = null;
                selectedDefs[method] = def;
                selectedDefIndex = null;
            } else {
                selectedDefs[method] = null;
            }
            document.getElementById("validation-def-area").innerHTML = "";
            renderStep3UI();
        }

        function handleDefDragStart(e, index) {
            if (defsValidated) return;
            playClick();
            e.dataTransfer.setData("text/plain", "def:" + index);
            setTimeout(() => e.target.classList.add('opacity-50'), 10);
        }

        function handleDefDragOver(e) {
            e.preventDefault();
            if (defsValidated) return;
            e.currentTarget.classList.add('scale-[1.02]', 'ring-2');
        }

        function handleDefDragLeave(e) {
            e.currentTarget.classList.remove('scale-[1.02]', 'ring-2');
        }
        
        function handleDefDrop(e, method) {
            e.preventDefault();
            e.currentTarget.classList.remove('scale-[1.02]', 'ring-2');
            if (defsValidated) return;
            
            const data = e.dataTransfer.getData("text/plain");
            if(data && data.startsWith("def:")) {
                playClick();
                const idx = parseInt(data.split(":")[1]);
                const def = shuffledDefs[idx];
                if(selectedDefs.CROC?.originalIndex === def.originalIndex) selectedDefs.CROC = null;
                if(selectedDefs.CERC?.originalIndex === def.originalIndex) selectedDefs.CERC = null;
                selectedDefs[method] = def;
                selectedDefIndex = null;
                renderStep3UI();
            }
        }

        function validerDefs() {
            playClick();
            const crocCorrect = selectedDefs.CROC.id === 'CROC';
            const cercCorrect = selectedDefs.CERC.id === 'CERC';
            const valArea = document.getElementById("validation-def-area");

            if (crocCorrect && cercCorrect) {
                playSuccess();
                defsValidated = true;
                valArea.innerHTML = `
                    <div class="flex flex-col items-center gap-4 animate-fade-in w-full">
                        <div class="bg-success-bg border border-success text-success-text text-sm font-bold py-4 px-6 rounded-xl flex items-center justify-center gap-3 w-full md:w-auto">
                            <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Excellent ! Vous avez parfaitement identifié les méthodes.
                        </div>
                        <button onclick="afficherDebrief()" class="w-full md:w-auto bg-brand hover:bg-brand-hover text-white font-bold py-4 px-10 rounded-xl transition-all shadow-md flex items-center justify-center gap-2">
                            Voir le bilan final
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </button>
                    </div>
                `;
                document.getElementById('def-slot-CROC').onclick = null;
                document.getElementById('def-slot-CERC').onclick = null;
            } else {
                playError();
                valArea.innerHTML = `
                    <div class="bg-error-bg border border-error text-error text-sm font-medium py-3 px-6 rounded-xl flex items-center gap-3 animate-shake w-full md:w-auto justify-center mb-4">
                        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        Il y a une erreur. Vérifiez vos associations et éliminez les intrus.
                    </div>
                `;
            }
        }

        function afficherDebrief() {
            document.getElementById("zone-activite").style.display = "none";
            document.getElementById("progression-wrap").style.display = "none";
            
            const debrief = document.getElementById("debrief");
            debrief.className = "block animate-slide-up w-full";
            
            debrief.innerHTML = `
                <div class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">
                    <div class="bg-brand p-8 text-white text-center relative overflow-hidden">
                        <div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
                        <div class="relative z-10">
                            <div class="mb-4 text-white">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-16 h-16 mx-auto"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/><path d="m9 11 3 3L22 4"/></svg>
                            </div>
                            <h2 class="text-2xl md:text-3xl font-extrabold mb-2">Activité terminée !</h2>
                            <p class="text-white/80 max-w-lg mx-auto text-sm md:text-base leading-relaxed">Vous maîtrisez désormais l'architecture des appels téléphoniques, qu'ils soient sortants ou entrants.</p>
                        </div>
                    </div>
                    
                    <div class="p-6 md:p-10 flex flex-col md:flex-row gap-8">
                        <div class="flex-1 bg-slate-50 rounded-2xl p-6 border-t-4 border-accent shadow-sm">
                            <div class="flex items-center gap-3 mb-4">
                                <div class="w-10 h-10 rounded-xl bg-accent text-white flex items-center justify-center font-bold shadow-sm">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/><path d="M14.05 2a9 9 0 0 1 8 7.94"/><path d="M14.05 6A5 5 0 0 1 18 10"/></svg>
                                </div>
                                <div>
                                    <h3 class="font-bold text-slate-800 text-lg">CROC</h3>
                                    <p class="text-xs font-bold uppercase tracking-wider text-accent">Appels sortants</p>
                                </div>
                            </div>
                            <ul class="space-y-3">
                                <li class="flex items-start gap-3 text-sm text-slate-600"><span class="font-bold text-accent w-4">C</span> <span><strong>Contact :</strong> Salutation, Prénom, contrôle de l'interlocuteur.</span></li>
                                <li class="flex items-start gap-3 text-sm text-slate-600"><span class="font-bold text-accent w-4">R</span> <span><strong>Raison :</strong> Annoncer clairement le prétexte de l'appel pour capter l'attention.</span></li>
                                <li class="flex items-start gap-3 text-sm text-slate-600"><span class="font-bold text-accent w-4">O</span> <span><strong>Objectif :</strong> Exprimer la conclusion souhaitée (RDV, vente...).</span></li>
                                <li class="flex items-start gap-3 text-sm text-slate-600"><span class="font-bold text-accent w-4">C</span> <span><strong>Conclusion :</strong> Reformuler l'accord, remercier et saluer positivement.</span></li>
                            </ul>
                        </div>

                        <div class="flex-1 bg-slate-50 rounded-2xl p-6 border-t-4 border-brand shadow-sm">
                            <div class="flex items-center gap-3 mb-4">
                                <div class="w-10 h-10 rounded-xl bg-brand text-white flex items-center justify-center font-bold shadow-sm">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/><path d="m14 10 6-6"/><path d="M15 4h5v5"/></svg>
                                </div>
                                <div>
                                    <h3 class="font-bold text-slate-800 text-lg">CERC</h3>
                                    <p class="text-xs font-bold uppercase tracking-wider text-brand">Appels entrants</p>
                                </div>
                            </div>
                            <ul class="space-y-3">
                                <li class="flex items-start gap-3 text-sm text-slate-600"><span class="font-bold text-brand w-4">C</span> <span><strong>Contact :</strong> Identification et accueil chaleureux de la demande.</span></li>
                                <li class="flex items-start gap-3 text-sm text-slate-600"><span class="font-bold text-brand w-4">E</span> <span><strong>Écoute :</strong> Comprendre la demande et reformuler pour valider.</span></li>
                                <li class="flex items-start gap-3 text-sm text-slate-600"><span class="font-bold text-brand w-4">R</span> <span><strong>Réponse :</strong> Apporter une solution adaptée, claire et précise.</span></li>
                                <li class="flex items-start gap-3 text-sm text-slate-600"><span class="font-bold text-brand w-4">C</span> <span><strong>Conclusion :</strong> Reformuler l'accord, vérifier la satisfaction et prendre congé.</span></li>
                            </ul>
                        </div>
                    </div>
                    
                    <div class="px-6 pb-8 md:px-10 flex justify-center">
                        <button onclick="recommencer()" class="w-full md:w-auto bg-white border-2 border-brand text-brand hover:bg-brand hover:text-white font-bold py-4 px-10 rounded-xl transition-all shadow-sm flex items-center justify-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            Recommencer l'activité
                        </button>
                    </div>
                </div>
            `;
        }

        const btnFs = document.getElementById('btn-fullscreen');
        const iconEnter = document.getElementById('icon-fs-enter');
        const iconExit = document.getElementById('icon-fs-exit');
        const spotlight = document.getElementById('spotlight-overlay');

        function toggleFullScreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(err => console.warn("Plein écran bloqué"));
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }

        function updateFsIcons() {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                iconEnter.classList.add('hidden');
                iconExit.classList.remove('hidden');
            } else {
                iconEnter.classList.remove('hidden');
                iconExit.classList.add('hidden');
            }
        }

        btnFs.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleFullScreen();
            hideSpotlight();
        });

        document.addEventListener('fullscreenchange', updateFsIcons);
        document.addEventListener('webkitfullscreenchange', updateFsIcons);

        function hideSpotlight() {
            if(spotlight && !spotlight.classList.contains('opacity-0')) {
                spotlight.classList.add('opacity-0');
                setTimeout(() => spotlight.style.display = 'none', 1000);
            }
        }

        document.addEventListener('click', hideSpotlight, { once: true });
        renderStep0();
    </script>
</body>
</html>
