<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traiter les objections et conclure</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            DEFAULT: '#000099',
                            light: '#e6e6ff',
                            hover: '#0000cc',
                            muted: '#3333b3'
                        },
                        accent: {
                            DEFAULT: '#810464',
                            light: '#fdf2f8',
                        },
                        success: {
                            DEFAULT: '#10b981',
                            bg: '#ecfdf5',
                            text: '#065f46',
                            border: '#6ee7b7'
                        },
                        error: {
                            DEFAULT: '#ef4444',
                            bg: '#fef2f2',
                            text: '#991b1b',
                            border: '#fca5a5'
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out forwards',
                        'slide-up': 'slideUp 0.4s ease-out forwards',
                        'pop-in': 'popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(15px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        popIn: {
                            '0%': { opacity: '0', transform: 'scale(0.9)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        }
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer components {
            .btn-choix {
                @apply flex flex-col gap-2 p-5 border-2 border-slate-200 rounded-2xl bg-slate-50 cursor-pointer transition-all duration-300 text-left w-full relative overflow-hidden;
            }
            .btn-choix:hover:not(:disabled) {
                @apply border-brand bg-brand-light/30 transform -translate-y-1 shadow-md;
            }
            .btn-choix:disabled {
                @apply cursor-default;
            }
            
            /* Etats après réponse Phase 1 */
            .btn-choix-p1.juste {
                @apply border-success bg-success-bg transform-none shadow-none ring-2 ring-success/20;
            }
            .btn-choix-p1.juste .choix-titre { @apply text-success; }
            .btn-choix-p1.faux {
                @apply border-error bg-error-bg opacity-80 transform-none shadow-none;
            }
            .btn-choix-p1.faux .choix-titre { @apply text-error; }
            .btn-choix-p1.neutre {
                @apply opacity-40 grayscale-[50%] bg-slate-100 border-slate-200 transform-none shadow-none;
            }

            /* Etats après réponse Phase 2 */
            .btn-choix-p2.juste {
                @apply border-success bg-success-bg ring-2 ring-success/20 transform-none shadow-none;
            }
            .btn-choix-p2.faux {
                @apply border-error bg-error-bg opacity-75 transform-none shadow-none;
            }
            .btn-choix-p2.neutre-apres {
                @apply opacity-40 grayscale-[50%] bg-slate-100 border-slate-200;
            }

            .progress-dot {
                @apply w-2.5 h-2.5 rounded-full bg-slate-200 transition-all duration-300;
            }
            .progress-dot.active { @apply bg-brand ring-4 ring-brand-light scale-110; }
            .progress-dot.done { @apply bg-success; }
        }

        body {
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 font-sans p-4 md:p-8 flex flex-col items-center">

    <button id="btn-fullscreen" class="fixed top-4 right-4 z-50 bg-white p-3 rounded-full shadow-lg border border-slate-200 text-brand hover:bg-brand hover:text-white transition-all group" title="Plein écran">
        <svg id="icon-fs-enter" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        <svg id="icon-fs-exit" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 hidden"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>
    </button>

    <div id="spotlight-overlay" class="fixed inset-0 z-40 transition-opacity duration-1000 pointer-events-none flex items-start justify-end" style="background: radial-gradient(circle at calc(100% - 2.5rem) 2.5rem, transparent 32px, rgba(15, 23, 42, 0.75) 50px);">
        <div class="mr-[4.5rem] mt-[4.5rem] text-white font-medium text-sm flex items-center gap-3 animate-pulse bg-brand/90 py-2 px-4 rounded-xl backdrop-blur-sm border border-white/20 shadow-2xl">
            <span>Pour un meilleur confort, activez le plein écran</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M7 17L17 7"/><path d="M7 7h10v10"/></svg>
        </div>
    </div>

    <main class="w-full max-w-4xl flex flex-col gap-6 animate-fade-in mt-14 md:mt-0">
        
        <header class="bg-brand text-white rounded-3xl p-6 md:p-8 shadow-xl shadow-brand/10 flex flex-col md:flex-row items-start md:items-center gap-5 relative overflow-hidden">
            <div class="absolute -top-12 -right-12 w-40 h-40 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="w-14 h-14 min-w-[56px] bg-white text-brand rounded-2xl flex items-center justify-center shadow-sm z-10">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-7 h-7"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M12 18v-6"/><path d="M9 15h6"/></svg>
            </div>
            <div class="z-10">
                <div class="text-brand-light text-xs font-bold tracking-widest uppercase mb-1">Vente en magasin</div>
                <h1 class="text-2xl md:text-3xl font-extrabold leading-tight mb-2">Traiter les objections et conclure</h1>
                <div class="text-white/80 text-sm font-medium" id="header-subtitle">Activité en 2 étapes</div>
            </div>
        </header>

        <div class="w-full flex flex-col gap-3" id="progression-wrap">
            <div class="flex justify-between items-end text-sm">
                <span class="font-semibold text-slate-500 uppercase tracking-wider text-xs" id="progression-label">Partie 1 sur 2</span>
                <span class="font-bold text-brand bg-brand-light px-3 py-1 rounded-full text-xs" id="progression-score">Étape 1 / 4</span>
            </div>
            <div class="h-2.5 bg-slate-200 rounded-full overflow-hidden shadow-inner">
                <div class="h-full bg-brand rounded-full transition-all duration-500 ease-out relative" id="barre-fill" style="width:0%">
                    <div class="absolute inset-0 bg-white/20 w-full h-full animate-pulse"></div>
                </div>
            </div>
            <div class="flex gap-2 justify-center mt-1" id="progress-dots"></div>
        </div>

        <div id="zone-activite" class="w-full flex flex-col gap-6"></div>
        
        <div id="debrief" class="hidden"></div>
    </main>

    <script>
        // --- DONNEES DES SCENARIOS ---
        
        // Partie A : Sincère vs Prétexte
        const SCENARIOS_A = [
            {
                quote: "« Ce canapé est très confortable, mais j'ai vraiment peur que la couleur beige soit trop salissante avec notre chien. »",
                context: "Le client dit cela d'un ton détaché, tout en s'éloignant vers la sortie sans même regarder les échantillons de tissus anti-taches disposés sur la table.",
                type: "pretexte", // reponse attendue
                feedbackJuste: "Exact. Bien que l'objection paraisse fondée (la couleur salissante), le non-verbal (fuite vers la sortie) et le refus de regarder les solutions (tissus anti-taches) montrent qu'il utilise cet argument comme un prétexte pour écourter l'échange.",
                feedbackFaux: "Lisez bien le contexte. Si l'objection était sincère, le client s'intéresserait aux échantillons anti-taches. Son éloignement montre qu'il utilise cette excuse comme une porte de sortie polie."
            },
            {
                quote: "« J'hésite, je ne suis pas certain que les dimensions de ce modèle correspondent à mon salon. »",
                context: "Le client sort son téléphone pour regarder les photos de sa pièce et relit attentivement l'étiquette produit.",
                type: "sincere",
                feedbackJuste: "Bien vu. Le client projette réellement l'utilisation du produit (mesures, vérifications). Il exprime un frein concret sur lequel vous pouvez agir.",
                feedbackFaux: "Attention. Le fait qu'il vérifie ses photos et relise l'étiquette montre un intérêt réel. C'est une objection sincère : il cherche à être rassuré sur ce point précis."
            },
            {
                quote: "« Ah c'est intéressant... Mais je dois absolument en parler à mon associé d'abord. »",
                context: "Le client vous interrompt dès l'annonce du prix, n'a posé aucune question sur le produit et regarde sa montre avec insistance.",
                type: "pretexte",
                feedbackJuste: "Tout à fait. L'absence d'intérêt préalable pour le produit et le sentiment d'urgence (regarde sa montre) montrent une volonté manifeste d'échapper à la discussion.",
                feedbackFaux: "Prenez en compte son attitude. S'il n'a posé aucune question et regarde sa montre, c'est qu'il ne cherche pas vraiment l'accord de son associé, mais une porte de sortie."
            },
            {
                quote: "« J'aime beaucoup la finition, mais la garantie d'un an me paraît vraiment trop courte pour un investissement pareil. »",
                context: "Le client tient le produit en main et vous regarde de façon soutenue, attendant clairement une réponse de votre part.",
                type: "sincere",
                feedbackJuste: "C'est exact. C'est un frein réel, fondé et précis. Son regard montre qu'il attend de vous une solution (comme une extension de garantie) pour lever cette objection.",
                feedbackFaux: "Ce n'est pas une fuite. L'objection est précise (la durée de garantie) et le client attend votre réponse. C'est une objection sincère et objective."
            }
        ];

        // Partie B : Techniques (Réfutation, Prix, Conclusion)
        const SCENARIOS_B = [
            {
                theme: "Objection sur le Prix",
                context: "Le client aime votre abonnement logiciel, mais trouve le tarif élevé.",
                quote: "« Honnêtement, votre forfait Premium est 600 € plus cher à l'année que mon fournisseur actuel. »",
                options: [
                    { 
                        label: "La technique de la Division", 
                        text: "« 600 € sur l'année, cela représente à peine 1,60 € par jour pour sécuriser totalement la gestion de votre entreprise. »",
                        correct: true,
                        feedback: "Parfait ! La technique de la Division permet de ramener un coût global effrayant à un montant quotidien (ou mensuel) dérisoire, facilitant ainsi l'acceptation."
                    },
                    { 
                        label: "La technique de la Soustraction", 
                        text: "« Si le tarif est trop élevé, nous pouvons supprimer l'accès au support technique téléphonique pour réduire la facture. »",
                        correct: false,
                        feedback: "Ce n'est pas optimal ici. En proposant de soustraire un service d'emblée, vous dégradez votre offre avant même d'avoir défendu sa valeur."
                    },
                    { 
                        label: "La technique de la Valorisation", 
                        text: "« Ce décalage est tout à fait normal : notre logiciel possède des fonctionnalités uniques que vos fournisseurs n'ont pas. »",
                        correct: false,
                        feedback: "C'est mal calibré. Cette réponse peut paraître arrogante et ne justifie pas concrètement l'écart de prix aux yeux du client."
                    }
                ]
            },
            {
                theme: "Technique de Réfutation",
                context: "Le client s'intéresse à un nouveau matériau de construction écologique.",
                quote: "« C'est innovant, mais j'ai très peur que ce matériau soit fragile et qu'il s'abîme vite dans le temps. »",
                options: [
                    { 
                        label: "L'Écran", 
                        text: "« C'est une question très pertinente. Nous aborderons la solidité dans un instant, parlons d'abord des aspects tarifaires. »",
                        correct: false,
                        feedback: "Inapproprié. L'écran s'utilise pour repousser une objection prématurée (ex: le prix en début d'entretien). Ici, le client exprime une crainte majeure qu'il faut traiter immédiatement."
                    },
                    { 
                        label: "Le Témoignage", 
                        text: "« Je comprends. Sachez que l'entreprise Martin l'utilise depuis 3 ans sur ses chantiers et n'a constaté aucune dégradation. »",
                        correct: true,
                        feedback: "Excellent choix. Face à un doute sur la fiabilité, s'appuyer sur l'expérience réussie d'un autre client (Témoignage ou Preuve sociale) est le moyen le plus efficace de rassurer."
                    },
                    { 
                        label: "La Reformulation", 
                        text: "« Si je vous comprends bien, votre principale inquiétude concerne la résistance de ce matériau aux intempéries sur le long terme ? »",
                        correct: false,
                        feedback: "C'est une bonne amorce, mais la reformulation interrogative sert surtout à faire préciser une objection floue. Ici, l'objection est déjà claire, il faut y répondre factuellement."
                    }
                ]
            },
            {
                theme: "Conclure la Vente",
                context: "Toutes les objections ont été levées. Le client a choisi son modèle, il hoche la tête avec le sourire, mais le silence s'installe. Il attend.",
                quote: "(Silence positif du client)",
                options: [
                    { 
                        label: "L'Alternative", 
                        text: "« Puisque nous sommes d'accord sur le produit, vous préférez partir sur la finition bleue classique ou sur la rouge métallisée ? »",
                        correct: false,
                        feedback: "Hors sujet. Si le client a déjà choisi son modèle, relancer sur un choix d'option risque de faire renaître une hésitation. Il faut avancer."
                    },
                    { 
                        label: "L'Argument choc", 
                        text: "« Je vous conseille de vous décider rapidement, car ce modèle très demandé risque d'être en rupture de stock dès demain matin ! »",
                        correct: false,
                        feedback: "Trop agressif. La pression de l'urgence (Argument choc / Regret) s'utilise face à un client très indécis, pas face à un client déjà convaincu et apaisé."
                    },
                    { 
                        label: "Le Bilan (ou la Bobine)", 
                        text: "« Pour résumer : ce modèle correspond à votre espace et la livraison est incluse. Je vous prépare le contrat pour finaliser ? »",
                        correct: true,
                        feedback: "Très bien ! La technique du Bilan (ou Bobine) consiste à faire la synthèse des accords trouvés pour amener naturellement le client vers la conclusion logique de l'achat."
                    }
                ]
            }
        ];

        // --- GESTION DE L'ETAT ---
        let currentPhase = 'A'; // 'A' (Sincère/Prétexte) ou 'B' (Techniques)
        let currentIndex = 0;
        let scoreA = 0;
        let scoreB = 0;

        // --- AUDIO (Tone.js) ---
        let audioInitialized = false;
        let synth, polySynth, membrane, vol;

        async function initAudio() {
            if (audioInitialized) return;
            await Tone.start();
            vol = new Tone.Volume(-15).toDestination();

            synth = new Tone.Synth({
                oscillator: { type: "sine" },
                envelope: { attack: 0.1, decay: 0.2, sustain: 0, release: 0.2 }
            }).connect(vol);
            
            polySynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "triangle" },
                envelope: { attack: 0.05, decay: 0.2, sustain: 0.2, release: 1 }
            }).connect(vol);
            
            membrane = new Tone.MembraneSynth({
                pitchDecay: 0.01,
                octaves: 1,
                oscillator: { type: "sine" },
                envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.01 }
            }).connect(vol);
            
            audioInitialized = true;
        }

        function playClick() {
            if (!audioInitialized) initAudio();
            if (membrane) membrane.triggerAttackRelease("C5", "32n", Tone.now(), 0.1);
        }

        function playSuccess() {
            if (!audioInitialized) initAudio();
            if (polySynth) polySynth.triggerAttackRelease(["C4", "E4", "G4", "C5"], "8n", Tone.now(), 0.2);
        }

        function playError() {
            if (!audioInitialized) initAudio();
            if (synth) synth.triggerAttackRelease("C2", "8n", Tone.now(), 0.3);
        }

        // --- STREAMING_CHUNK:Rendu UI Phase A ---
        function renderProgressDots(total, current) {
            const container = document.getElementById("progress-dots");
            let html = "";
            for(let i=0; i<total; i++) {
                let stateClass = "";
                if(i < current) stateClass = "done";
                else if (i === current) stateClass = "active";
                html += `<div class="progress-dot ${stateClass}"></div>`;
            }
            container.innerHTML = html;
        }

        function updateProgress() {
            const totalItems = SCENARIOS_A.length + SCENARIOS_B.length;
            const absoluteCurrent = currentPhase === 'A' ? currentIndex : SCENARIOS_A.length + currentIndex;
            
            document.getElementById("progression-label").textContent = currentPhase === 'A' ? `Partie 1 sur 2 : Qualification` : `Partie 2 sur 2 : Techniques`;
            document.getElementById("progression-score").textContent = currentPhase === 'A' ? `Objection ${currentIndex + 1} / ${SCENARIOS_A.length}` : `Cas ${currentIndex + 1} / ${SCENARIOS_B.length}`;
            
            const pct = (absoluteCurrent / totalItems) * 100;
            document.getElementById("barre-fill").style.width = pct + "%";
            
            renderProgressDots(currentPhase === 'A' ? SCENARIOS_A.length : SCENARIOS_B.length, currentIndex);
        }

        function renderPhaseA() {
            const scenario = SCENARIOS_A[currentIndex];
            const zone = document.getElementById("zone-activite");
            updateProgress();

            zone.innerHTML = `
                <div class="bg-white rounded-3xl shadow-lg border border-slate-100 overflow-hidden animate-slide-up" onclick="initAudio()">
                    <div class="bg-slate-50 border-b border-slate-100 px-6 py-4 flex justify-between items-center">
                        <span class="text-xs font-bold tracking-widest uppercase text-slate-400">Qualifier l'objection</span>
                        <span class="text-xs font-bold uppercase tracking-wider px-3 py-1 bg-brand-light text-brand rounded-full">Analyse</span>
                    </div>
                    
                    <div class="p-6 md:p-8">
                        <div class="flex items-start gap-4 bg-slate-50 p-5 rounded-2xl border border-slate-200 mb-6">
                            <div class="w-10 h-10 rounded-full bg-slate-200 flex-shrink-0 flex items-center justify-center text-slate-500">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            </div>
                            <div>
                                <p class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Le client vous dit :</p>
                                <p class="text-lg font-medium text-slate-800 italic">${scenario.quote}</p>
                            </div>
                        </div>

                        <div class="border-l-4 border-brand pl-4 mb-8">
                            <p class="text-xs font-bold uppercase tracking-wider text-brand mb-1 flex items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                                Contexte et Non-verbal
                            </p>
                            <p class="text-sm text-slate-600 leading-relaxed">${scenario.context}</p>
                        </div>
                        
                        <h3 class="text-sm font-bold text-slate-700 mb-4 text-center">Selon vous, s'agit-il d'une objection sincère ou d'un prétexte ?</h3>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <button class="btn-choix btn-choix-p1 group" id="btn-sincere" onclick="validerPhaseA('sincere')">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-white shadow-sm flex items-center justify-center text-brand group-hover:bg-brand group-hover:text-white transition-colors">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                                    </div>
                                    <div class="flex flex-col items-start">
                                        <span class="choix-titre font-bold text-slate-700">Objection Sincère</span>
                                        <span class="text-xs text-slate-500">C'est un frein réel et concret.</span>
                                    </div>
                                </div>
                            </button>
                            <button class="btn-choix btn-choix-p1 group" id="btn-pretexte" onclick="validerPhaseA('pretexte')">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-white shadow-sm flex items-center justify-center text-accent group-hover:bg-accent group-hover:text-white transition-colors">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                                    </div>
                                    <div class="flex flex-col items-start">
                                        <span class="choix-titre font-bold text-slate-700">Objection Prétexte</span>
                                        <span class="text-xs text-slate-500">C'est une fuite ou un faux-fuyant.</span>
                                    </div>
                                </div>
                            </button>
                        </div>
                        
                        <div id="feedback-area" class="hidden mt-6 rounded-xl p-5 text-sm leading-relaxed animate-fade-in"></div>
                        
                        <button id="btn-next" onclick="nextPhaseA()" class="hidden mt-6 w-full bg-brand hover:bg-brand-hover text-white font-bold py-4 rounded-xl transition-all shadow-md items-center justify-center gap-2">
                            ${currentIndex < SCENARIOS_A.length - 1 ? "Objection suivante" : "Passer à la Partie 2 : Les Techniques"}
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </button>
                    </div>
                </div>
            `;
        }

        function validerPhaseA(choice) {
            playClick();

                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                                    </div>
                                    <h4 class="font-extrabold text-slate-800 text-lg">6 Techniques de Conclusion</h4>
                                </div>
                                <ul class="space-y-4">
                                    <li class="flex items-start gap-3">
                                        <svg class="w-5 h-5 text-[#810464] flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                                        <span class="text-sm text-slate-600 leading-relaxed"><strong class="text-slate-800">Alternative :</strong> Proposer un choix limité (A ou B).</span>
                                    </li>
                                    <li class="flex items-start gap-3">
                                        <svg class="w-5 h-5 text-[#810464] flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                                        <span class="text-sm text-slate-600 leading-relaxed"><strong class="text-slate-800">Anticipation :</strong> Répondre à l'ultime frein (Peau de l'ours).</span>
                                    </li>
                                    <li class="flex items-start gap-3">
                                        <svg class="w-5 h-5 text-[#810464] flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                                        <span class="text-sm text-slate-600 leading-relaxed"><strong class="text-slate-800">Bilan :</strong> Résumer les avantages trouvés (Bobine).</span>
                                    </li>
                                    <li class="flex items-start gap-3">
                                        <svg class="w-5 h-5 text-[#810464] flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                                        <span class="text-sm text-slate-600 leading-relaxed"><strong class="text-slate-800">Décision immédiate :</strong> Souligner l'urgence (Regret).</span>
                                    </li>
                                    <li class="flex items-start gap-3">
                                        <svg class="w-5 h-5 text-[#810464] flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                                        <span class="text-sm text-slate-600 leading-relaxed"><strong class="text-slate-800">Argument choc :</strong> Sortir la carte maîtresse (Crochet).</span>
                                    </li>
                                    <li class="flex items-start gap-3">
                                        <svg class="w-5 h-5 text-[#810464] flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                                        <span class="text-sm text-slate-600 leading-relaxed"><strong class="text-slate-800">Directe :</strong> Demander clairement l'engagement.</span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Bouton Recommencer -->
                    <div class="p-8 md:p-10 bg-white border-t border-slate-100 flex justify-center">
                        <button onclick="recommencer()" class="group w-full md:w-auto bg-white border-2 border-brand text-brand hover:bg-brand hover:text-white font-extrabold text-lg py-4 px-10 rounded-2xl transition-all duration-300 shadow-sm hover:shadow-[0_8px_30px_rgb(0,0,153,0.2)] flex items-center justify-center gap-3">
                            <svg class="w-6 h-6 group-hover:-rotate-180 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            Recommencer l'activité
                        </button>
                    </div>
                </div>
            `;
        }

        function recommencer() {
            playClick();
            currentPhase = 'A';
            currentIndex = 0;
            scoreA = 0;
            scoreB = 0;
            document.getElementById("debrief").className = "hidden";
            document.getElementById("zone-activite").style.display = "flex";
            document.getElementById("progression-wrap").style.display = "flex";
            renderPhaseA();
        }

        // --- GESTION PLEIN ECRAN & SPOTLIGHT ---
        const btnFs = document.getElementById('btn-fullscreen');
        const iconEnter = document.getElementById('icon-fs-enter');
        const iconExit = document.getElementById('icon-fs-exit');
        const spotlight = document.getElementById('spotlight-overlay');

        function toggleFullScreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(err => console.warn("Plein écran bloqué"));
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }

        function updateFsIcons() {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                iconEnter.classList.add('hidden');
                iconExit.classList.remove('hidden');
            } else {
                iconEnter.classList.remove('hidden');
                iconExit.classList.add('hidden');
            }
        }

        btnFs.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleFullScreen();
            hideSpotlight();
        });

        document.addEventListener('fullscreenchange', updateFsIcons);
        document.addEventListener('webkitfullscreenchange', updateFsIcons);

        function hideSpotlight() {
            if(spotlight && !spotlight.classList.contains('opacity-0')) {
                spotlight.classList.add('opacity-0');
                setTimeout(() => spotlight.style.display = 'none', 1000);
            }
        }

        document.addEventListener('click', hideSpotlight, { once: true });

        // Démarrage
        renderPhaseA();
    </script>
</body>
</html>
